name: Curation Scanner

# On a schedule, pick exactly one unassigned open `curation` issue or PR and
# advance it: research and curate a material, or tend a stalled PR. When the
# queue is empty, pick the next STUB material and open a curation issue for it
# so the queue never runs dry.

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      material:
        description: "Optional material file stem to curate directly (skips issue selection)"
        required: false
        default: ""
        type: string
      provider:
        description: "Deep research provider"
        required: false
        default: "claude_code"
        type: choice
        options: ["claude_code", "falcon", "openai", "perplexity"]
      model:
        description: "Model override"
        required: false
        default: ""
        type: string

concurrency:
  group: curation-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      AGENT_MODEL: ${{ inputs.model != '' && inputs.model || 'claude-opus-5' }}
      PROVIDER: ${{ inputs.provider || 'claude_code' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --group dev

      - name: Cache OAK ontology databases
        uses: actions/cache@v4
        with:
          path: ~/.data/oaklib
          key: oak-ohd-${{ hashFiles('conf/oak_config.yaml') }}

      - name: Run curation scanner
        id: scanner
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDISON_API_KEY: ${{ secrets.EDISON_API_KEY }}
          FUTUREHOUSE_API_KEY: ${{ secrets.FUTUREHOUSE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --dangerously-skip-permissions
            --model ${{ env.AGENT_MODEL }}
            --mcp-config '{"mcpServers": {"ols": {"command": "uvx", "args": ["ols-mcp"]}}}'
          prompt: |
            REPO: ${{ github.repository }}
            TRIGGER: ${{ github.event_name }}
            DIRECT MATERIAL: ${{ inputs.material || '' }}
            DEEP RESEARCH PROVIDER: ${{ env.PROVIDER }}

            You are the automated curation scanner for the dental materials
            knowledge base. Follow CLAUDE.md and the `curate-material` skill in
            .claude/skills/curate-material/SKILL.md.

            If DIRECT MATERIAL is set, curate that material and skip selection.

            Otherwise select exactly one item:

            1. Open, unassigned pull requests labelled `curation` that are
               stalled: failing checks, unresolved review comments, or
               conflicts. Prefer the oldest. Tend it: fix what the review or
               CI asks for when the fix is clear and safe, push, and comment
               with what you did. Never rebase locally to resolve conflicts;
               use `gh api` update-branch. If the next step is unclear, comment
               asking for guidance and stop.
            2. Else, open, unassigned issues labelled `curation`. Prefer
               `high-priority`, then oldest. Curate the material it names on a
               branch `curate/<slug>` and open a draft PR that says
               `Closes #<issue>`. Use DEEP RESEARCH PROVIDER for the research
               step. Comment on the issue with one sentence saying why this
               item was chosen.
            3. Else, the queue is empty. Run `uv run dentmatmech list --status
               STUB`, pick the material with the most children (a parent class
               is more useful than a leaf) or, on a tie, the first
               alphabetically, and open ONE issue titled
               `Curate <name> (<OHD id>)` with the `curation` label describing
               the scope. Do not curate it in this run.

            Rules:
            - One item per run. Touch nothing else.
            - Verify every regulation number, device class, and product code
              against the CFR text and the FDA product classification database
              as the skill describes. Never carry a value from memory or from
              the research report into the entry unverified.
            - Snippets are verbatim quotes from cached abstracts. Run
              `just validate` and `just validate-references` on the file
              before committing, and `uv run pytest -q`.
            - Stage only kb/materials/<file>.yaml, references_cache/,
              research/<file>-*, and docs/regulatory.md. Never stage pages/ or
              app/.
            - Open PRs as drafts. Skip items assigned to a person.
            - Be conservative. When in doubt, comment instead of changing.

      - name: Write step summary
        if: ${{ !cancelled() && steps.scanner.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.scanner.outputs.execution_file }}
        run: |
          {
            echo "## Curation scanner run"
            echo
            echo '```'
            python3 - "$EXECUTION_FILE" <<'PY' || true
          import json, sys
          last = ""
          for line in open(sys.argv[1], encoding="utf-8"):
              line = line.strip()
              if not line:
                  continue
              try:
                  ev = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(ev, dict) and ev.get("type") == "result":
                  last = ev.get("result") or ""
          print(last[:6000])
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
