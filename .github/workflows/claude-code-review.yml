name: Claude Code Review

# Reviews every PR that touches the knowledge base, using the
# dentmatmech-pr-review skill, and submits an approve or request-changes
# review. Can also be pointed at a PR by hand.

on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'kb/materials/**'
      - 'references_cache/**'
      - 'src/dentmatmech/schema/**'
      - 'docs/regulatory.md'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

env:
  AGENT_MODEL: claude-opus-5
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  review:
    # Fork PRs get no secrets; skip them rather than fail.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out the PR branch (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout "$PR_NUMBER"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --group dev

      - name: Cache OAK ontology databases
        uses: actions/cache@v4
        with:
          path: ~/.data/oaklib
          key: oak-ohd-${{ hashFiles('conf/oak_config.yaml') }}

      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          claude_args: |
            --model ${{ env.AGENT_MODEL }}
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(cat:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(ls:*),Bash(just:*),Bash(uv run:*),Bash(curl:*),Read,Glob,Grep,WebFetch"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request using the dentmatmech-pr-review skill in
            .claude/skills/dentmatmech-pr-review/SKILL.md. Run the validators
            named there rather than reasoning about what they would say.

            Regulatory facts get the most scrutiny. A regulation number, device
            class, or product code that does not match the CFR text or the FDA
            product classification database is CRITICAL.

            Finish by submitting a review with `gh pr review`: request changes
            if any CRITICAL or IMPORTANT finding stands, otherwise approve. A
            comment alone does not clear a request-changes review, so do not
            stop at a comment.

      # claude-code-action exits 0 even when the agent run errored, which
      # would show as a green check with no review posted. Fail loudly instead,
      # and call out a usage-limit error so it is not mistaken for a bug.
      - name: Verify the review agent actually ran
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -euo pipefail
          file="${EXECUTION_FILE:-}"
          if [ -z "$file" ] || [ ! -f "$file" ]; then
            echo "::error::No execution log from claude-code-action; the agent did not run."
            exit 1
          fi
          if grep -q '"is_error": *true' "$file"; then
            if grep -qi 'rate_limit\|usage limit' "$file"; then
              echo "::error::Claude usage limit hit; the review did not run. Add ANTHROPIC_API_KEY or wait for the limit to reset."
            else
              echo "::error::The review agent reported an error. See the execution log."
            fi
            exit 1
          fi
