---
name: Deploy site

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies
        run: uv sync --group dev --no-progress

      # Material pages and the browser are rendered fresh from kb/, then the
      # mkdocs site (schema docs + narrative docs) is built and the two are
      # combined: mkdocs output at the root, pages/ and app/ alongside it.
      - name: Render material pages and browser data
        run: |
          just render
          just export-browser

      - name: Build mkdocs site
        run: |
          just gen-doc
          uv run mkdocs build --site-dir site

      - name: Assemble site
        run: |
          cp -r pages site/pages
          cp -r app site/app

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
