name: Generate Pages

# Re-render pages/ and app/data.js whenever the knowledge base or the renderer
# changes on main, and commit the result back. Pushes made with GITHUB_TOKEN do
# not trigger other workflows, so this cannot loop; the site deploy renders on
# its own anyway, so this commit exists so the repo copy stays current for
# anyone reading pages/ directly.

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - 'kb/materials/*.yaml'
      - 'src/dentmatmech/render.py'
      - 'src/dentmatmech/export.py'
      - 'src/dentmatmech/templates/**'
      - 'src/dentmatmech/schema/**'
  workflow_dispatch:

concurrency:
  group: generate-pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync

      - name: Render
        run: |
          just render
          just export-browser

      - name: Commit rendered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages app/data.js
          if git diff --cached --quiet; then
            echo "Pages unchanged."
            exit 0
          fi
          git commit -m "Regenerate pages and browser data [skip ci]"
          git push
