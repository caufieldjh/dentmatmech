---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --group dev

      # OHD is small (~3 MB). Cache the OAK SQLite build so term validation
      # does not re-download it on every run.
      - name: Cache OAK ontology databases
        uses: actions/cache@v4
        with:
          path: ~/.data/oaklib
          key: oak-ohd-${{ hashFiles('conf/oak_config.yaml') }}

      - name: Lint
        run: uvx ruff check .

      - name: Regenerate Python datamodel
        run: just gen-python

      - name: Schema generation smoke test
        run: uv run gen-project -d tmp src/dentmatmech/schema/dentmatmech.yaml

      - name: Validate every material file (schema + ontology terms + links)
        run: just validate-all

      - name: Run tests
        run: uv run pytest -q

      - name: Render pages and browser data
        run: |
          just render
          just export-browser
          git diff --stat -- pages app || true
