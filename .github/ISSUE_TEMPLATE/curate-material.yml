name: Curate a material
description: Request curation of one dental material entry
title: "Curate <material name> (<OHD id>)"
labels: ["curation"]
body:
  - type: input
    id: material
    attributes:
      label: Material
      description: Name as it appears in kb/materials/ (run `uv run dentmatmech list`), or the OHD term if no stub exists yet
      placeholder: Glass ionomer cement (OHD:0001006)
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Full curation of a stub
        - Regulatory status only
        - Add or fix specific content (describe below)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should be added or fixed. Paste known regulation numbers, product codes, K-numbers, or PMIDs if you have them; they will be verified, not trusted.
  - type: input
    id: provider
    attributes:
      label: Deep research provider
      description: claude_code (default), falcon, openai, perplexity
      placeholder: claude_code
