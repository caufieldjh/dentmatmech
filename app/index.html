<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse · dentmatmech</title>
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --panel:#f8fafc; --accent:#0f766e; --accent-soft:#ccfbf1; --fda:#1d4ed8; --fda-soft:#dbeafe; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); line-height:1.5; }
  nav { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:.6rem 1.2rem; display:flex; gap:1.2rem; align-items:center; z-index:5; }
  nav .logo { font-weight:700; color:var(--accent); text-decoration:none; }
  nav a { color:var(--muted); text-decoration:none; }
  .wrap { display:grid; grid-template-columns: 260px 1fr; gap:1.2rem; max-width:1200px; margin:0 auto; padding:1.2rem; }
  @media (max-width: 800px) { .wrap { grid-template-columns:1fr; } }
  aside { border-right:1px solid var(--line); padding-right:1rem; }
  aside h3 { font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:1rem 0 .3rem; }
  aside label { display:flex; justify-content:space-between; font-size:.9rem; padding:.1rem 0; cursor:pointer; }
  aside label span.n { color:var(--muted); }
  input[type=search] { width:100%; padding:.5rem .7rem; border:1px solid var(--line); border-radius:8px; font-size:1rem; }
  .card { border:1px solid var(--line); border-radius:10px; padding:.8rem 1rem; margin:.6rem 0; }
  .card h2 { font-size:1.1rem; margin-bottom:.2rem; }
  .card h2 a { color:var(--ink); text-decoration:none; }
  .card h2 a:hover { color:var(--accent); }
  .card p { color:#374151; font-size:.92rem; }
  .pills { display:flex; flex-wrap:wrap; gap:.3rem; margin:.3rem 0; }
  .pill { font-size:.75rem; padding:.1rem .5rem; border-radius:999px; background:var(--panel); border:1px solid var(--line); }
  .pill.fda { background:var(--fda-soft); color:#1e3a8a; }
  .pill.accent { background:var(--accent-soft); color:#134e4a; }
  .count { color:var(--muted); font-size:.9rem; margin:.3rem 0 .6rem; }
  button.clear { margin-top:.8rem; font-size:.85rem; background:none; border:1px solid var(--line); border-radius:6px; padding:.2rem .6rem; cursor:pointer; }
</style>
</head>
<body>
<nav>
  <a class="logo" href="../pages/materials/index.html">dentmatmech</a>
  <a href="../pages/materials/index.html">Materials</a>
  <a href="index.html">Browse</a>
  <a href="https://github.com/caufieldjh/dentmatmech">GitHub</a>
</nav>
<div class="wrap">
  <aside>
    <input type="search" id="q" placeholder="Search materials…" aria-label="Search">
    <div id="facets"></div>
    <button class="clear" id="clear">Clear filters</button>
  </aside>
  <section>
    <div class="count" id="count"></div>
    <div id="results"></div>
  </section>
</div>
<script src="data.js"></script>
<script>
(function () {
  const DATA = window.DENTMATMECH_DATA || [];
  const FACETS = [
    ["category", "Category"],
    ["curation_status", "Curation status"],
    ["fda_device_classes", "FDA device class"],
    ["fda_regulations", "FDA regulation (21 CFR)"],
    ["use_contexts", "Clinical use context"],
    ["setting_mechanisms", "Setting mechanism"],
    ["agencies", "Regulator recorded"],
  ];
  const state = { q: "", sel: {} };
  const title = (s) => (s || "").replace(/_/g, " ").toLowerCase().replace(/^./, (c) => c.toUpperCase());

  function valuesOf(rec, key) { const v = rec[key]; return Array.isArray(v) ? v : (v ? [v] : []); }

  function matches(rec) {
    if (state.q) {
      const hay = [rec.name, rec.description, rec.term_id, rec.term_label, ...(rec.synonyms || []), ...(rec.fda_product_codes || [])].join(" ").toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    for (const [key, chosen] of Object.entries(state.sel)) {
      if (!chosen.size) continue;
      const vals = valuesOf(rec, key);
      if (![...chosen].some((c) => vals.includes(c))) return false;
    }
    return true;
  }

  function render() {
    const rows = DATA.filter(matches).sort((a, b) => a.name.localeCompare(b.name));
    document.getElementById("count").textContent = `${rows.length} of ${DATA.length} materials`;
    document.getElementById("results").innerHTML = rows.map((r) => `
      <div class="card">
        <h2><a href="${r.page_url}">${r.name}</a></h2>
        <div class="pills">
          <span class="pill accent">${r.term_id}</span>
          <span class="pill">${title(r.category)}</span>
          <span class="pill">${title(r.curation_status)}</span>
          ${(r.fda_device_classes || []).map((c) => `<span class="pill fda">FDA ${title(c)}</span>`).join("")}
          ${(r.fda_regulations || []).map((c) => `<span class="pill fda">21 CFR ${c}</span>`).join("")}
          ${(r.fda_product_codes || []).map((c) => `<span class="pill fda">${c}</span>`).join("")}
          ${r.n_evidence ? `<span class="pill">${r.n_evidence} evidence</span>` : ""}
        </div>
        <p>${r.description || ""}</p>
        ${r.parents.length ? `<p class="count">Parent: ${r.parents.join(", ")}</p>` : ""}
      </div>`).join("") || `<p class="count">Nothing matches.</p>`;
    renderFacets(rows);
  }

  function renderFacets(rows) {
    const el = document.getElementById("facets");
    el.innerHTML = FACETS.map(([key, label]) => {
      const counts = {};
      for (const r of rows) for (const v of valuesOf(r, key)) counts[v] = (counts[v] || 0) + 1;
      // keep chosen values visible even when count is zero
      for (const v of state.sel[key] || []) counts[v] = counts[v] || 0;
      const vals = Object.keys(counts).sort();
      if (!vals.length) return "";
      return `<h3>${label}</h3>` + vals.map((v) => `
        <label><span><input type="checkbox" data-key="${key}" data-val="${v}" ${(state.sel[key] || new Set()).has(v) ? "checked" : ""}> ${title(v)}</span><span class="n">${counts[v]}</span></label>`).join("");
    }).join("");
    el.querySelectorAll("input[type=checkbox]").forEach((cb) => cb.addEventListener("change", (e) => {
      const { key, val } = e.target.dataset;
      state.sel[key] = state.sel[key] || new Set();
      e.target.checked ? state.sel[key].add(val) : state.sel[key].delete(val);
      render();
    }));
  }

  document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById("clear").addEventListener("click", () => { state.sel = {}; state.q = ""; document.getElementById("q").value = ""; render(); });
  render();
})();
</script>
</body>
</html>
