    description: How far along this entry is
    from_schema: https://w3id.org/caufieldjh/dentmatmech
    slot_uri: dentmatmech:curation_status
    owner: DentalMaterial
    domain_of:
    - DentalMaterial
    range: CurationStatusEnum
    recommended: true
  notes:
    name: notes
    definition_uri: https://w3id.org/caufieldjh/dentmatmech/notes
    description: Curator notes that do not belong in any structured section
    from_schema: https://w3id.org/caufieldjh/dentmatmech
    slot_uri: dentmatmech:notes
    owner: DentalMaterial
    domain_of:
    - RegulatoryStatus
    - DentalMaterial
    range: string
  id:
    name: id
    definition_uri: https://w3id.org/caufieldjh/dentmatmech/id
    description: A CURIE identifying an ontology term
    examples:
    - value: OHD:0000036
    from_schema: https://w3id.org/caufieldjh/dentmatmech
    slot_uri: dentmatmech:id
    owner: Mapping
    domain_of:
    - Term
    - Mapping
    range: uriorcurie
    required: true
  label:
    name: label
    definition_uri: https://w3id.org/caufieldjh/dentmatmech/label
    description: The canonical label of the ontology term, as validated against the
      source ontology
    from_schema: https://w3id.org/caufieldjh/dentmatmech
    slot_uri: dentmatmech:label
    owner: Mapping
    domain_of:
    - Term
    - Mapping
    range: string
    required: true
  preferred_term:
    name: preferred_term
    definition_uri: https://w3id.org/caufieldjh/dentmatmech/preferred_term
    description: The preferred human-readable term for this descriptor. May be more
