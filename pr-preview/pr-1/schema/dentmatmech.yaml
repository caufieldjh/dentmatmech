    slot_uri: dentmatmech:material_term
    owner: DentalMaterial
    domain_of:
    - DentalMaterial
    range: DentalMaterialDescriptor
    required: true
    inlined: true
    inlined_as_list: true
  category:
    name: category
    definition_uri: https://w3id.org/caufieldjh/dentmatmech/category
    description: Broad material class
    from_schema: https://w3id.org/caufieldjh/dentmatmech
    slot_uri: dentmatmech:category
