  special_controls: []
  identification: A resin tooth bonding agent is a device material, such as methylmethacrylate, intended to be painted on the interior of a prepared cavity of a tooth to improve retention of a restoration, such as a filling.
  approved_uses:
  - name: Painting on the interior of a prepared cavity of a tooth to improve retention of a restoration
    use_context: ADHESIVE
    anatomical_site:
      preferred_term: calcareous tooth
      term:
        id: UBERON:0001091
        label: calcareous tooth
  source_url: https://www.ecfr.gov/current/title-21/section-872.3200
  notes: No FDA regulation names HEMA. The monomer reaches market inside bonding agents and primers classified
    under this regulation. Paragraph (b) states only the class; no special controls guidance and no 510(k)
    exemption are stated. The product classification database lists one product code, KLE "agent, tooth
    bonding, resin", class 2, submission type 510(k). Product-level clearances are recorded under products.
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3200
    reference_title: 21 CFR 872.3200 Resin tooth bonding agent
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
