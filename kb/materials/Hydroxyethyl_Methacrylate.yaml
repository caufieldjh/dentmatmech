composition:
- name: 2-hydroxyethyl methacrylate monomer
  role: MATRIX
  chemical:
    preferred_term: 2-hydroxyethyl methacrylate
    term:
      id: CHEBI:34288
      label: 2-hydroxyethyl methacrylate
  proportion: 0 to 36% in experimental one-step self-etch adhesives; about 10% gave the best bond strength
  description: The material is a single compound. In an adhesive it copolymerizes with the cross-linking
    dimethacrylates (bis-GMA, UDMA, TEGDMA) and acidic functional monomers, wets demineralized dentin,
    and keeps the resin from separating from water as the solvent evaporates. Raising its proportion past
    about 10% lowers bond strength and degree of conversion.
  evidence:
  - reference: PMID:17543382
    reference_title: Systematic review of the chemical composition of contemporary dental adhesives.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: Irrespective of the number of bottles, an adhesive system typically contains resin monomers, curing initiators, inhibitors or stabilizers, solvents and sometimes inorganic filler.
    explanation: Places HEMA among the resin monomers of an adhesive formulation.
  - reference: PMID:18433860
    reference_title: The role of HEMA in one-step self-etch adhesives.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The tested experimental adhesives (Exp-0, Exp-10, Exp-19 and Exp-36) only differed in their concentration of HEMA, which was 0, 10, 19 and 36%, respectively."
    explanation: The concentration range tested in experimental one-step self-etch adhesives.
  - reference: PMID:18433860
    reference_title: The role of HEMA in one-step self-etch adhesives.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A small amount of HEMA (10%) improved the bond strength of a one-step self-etch adhesive.
    explanation: The proportion at which HEMA helped bonding most.
  - reference: PMID:15186380
    reference_title: Methacrylates in dental restorative materials.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The most frequently occurring methacrylates in the bonding materials were 2-hydroxyethyl methacrylate (2-HEMA)
    explanation: Chemical analysis of commercial bonding agents; HEMA is the most common monomer found.
clinical_uses:
- name: Hydrophilic co-monomer in dentin adhesives and primers for bonding resin composite
  use_context: ADHESIVE
  procedure:
    preferred_term: resin filling restoration procedure
    term:
      id: OHD:0000042
      label: resin filling restoration procedure
  anatomical_site:
    preferred_term: dentine
    term:
      id: UBERON:0001751
      label: dentine
  description: HEMA is added to etch-and-rinse, self-etch, and universal adhesives to wet dentin, carry
    resin into demineralized collagen, and prevent phase separation between the hydrophobic monomers
    and water in one-bottle systems.
  indications:
  - Bonding of direct resin composite restorations to enamel and dentin
  - Priming of dentin in multi-step adhesive systems
  contraindications:
  - Known contact allergy to HEMA or other methacrylates
  evidence:
  - reference: PMID:18433860
    reference_title: The role of HEMA in one-step self-etch adhesives.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In spite of its high allergenic potential, 2-hydroxyethyl methacrylate (HEMA), a low-molecular-weight monomer, is frequently used in adhesives for its positive influence on the bond strength.
    explanation: States why HEMA is in adhesives.
  - reference: PMID:15668338
    reference_title: Monomer-solvent phase separation in one-step self-etch adhesives.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The prompt disappearance of droplets upon application of a small amount of HEMA (2-hydroxyethyl methacrylate) or a HEMA-containing bonding agent, as well as the absence of droplets at the interface of all HEMA-containing adhesives, strongly suggests that the adhesive monomers separate from water upon evaporation of ethanol/acetone.
    explanation: The phase-separation role of HEMA in one-step adhesives.
  - reference: PMID:39838443
    reference_title: "HEMA-free versus HEMA-containing adhesive systems: a systematic review."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: Although the addition of HEMA to dental adhesives improves dentin wettability and resin diffusion into demineralized collagen fibrils, HEMA's high hydrophilicity can lead to hydrolytic degradation of the adhesive interface.
    explanation: Summarizes the benefit and the cost of HEMA in an adhesive.
- name: Resin component of resin-modified glass ionomer cements
  use_context: DIRECT_RESTORATION
  anatomical_site:
    preferred_term: calcareous tooth
    term:
      id: UBERON:0001091
      label: calcareous tooth
  description: HEMA is the polymerizable resin in the liquid of resin-modified glass ionomer cements. Its
    polymerization runs alongside the acid-base reaction and makes the cement light-curable. These cements
    are used as restoratives, liners, and luting agents; the OHD entry for resin-modified glass ionomer
    carries that detail.
  evidence:
  - reference: PMID:26916063
    reference_title: HEMA release and degree of conversion from a resin-modified glass ionomer cement after various delays of light activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The setting of resin-modified glass ionomer cements (RMGIC) involves the acid-base reaction and the polymerization of HEMA monomers.
    explanation: Names HEMA as the resin phase of RMGIC.
  - reference: PMID:15186380
    reference_title: Methacrylates in dental restorative materials.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The main methacrylate of the 2 glass ionomers was 2-HEMA or trimethylolpropane trimethacrylate.
    explanation: Chemical analysis of commercial resin-modified glass ionomers.
- name: Hydrophilic monomer in resin luting cements
  use_context: LUTING
  procedure:
    preferred_term: crown restoration procedure
    term:
      id: OHD:0000033
      label: crown restoration procedure
  anatomical_site:
    preferred_term: dentine
    term:
      id: UBERON:0001751
      label: dentine
  description: Resin cements used to lute indirect restorations contain HEMA, which is detectable in the
    pulp chamber after cementation through remaining dentin.
  evidence:
  - reference: PMID:26714346
    reference_title: Diffusion of HEMA from resin cements through different dentin thicknesses in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: HEMA was detected in the pulp chamber elutes of all the teeth.
    explanation: Three resin cements (RelyX ARC, Panavia F 2.0, Multilink Automix) all released HEMA through dentin.
- name: Dentin desensitizing agent in combination with glutaraldehyde
  use_context: OTHER
  anatomical_site:
    preferred_term: dentine
    term:
      id: UBERON:0001751
      label: dentine
  description: Aqueous glutaraldehyde and HEMA (the Gluma formulation, 5% glutaraldehyde and 35% HEMA) is
    applied to exposed dentin to occlude tubules and reduce dentin hypersensitivity. No OHD procedure
    term for dentin desensitization was found.
  evidence:
  - reference: PMID:23243978
    reference_title: Effects of two topical desensitizing agents and placebo on dentin hypersensitivity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pain reduction with GLU was consistently highest, followed by PLA that was significantly greater than BIS.
    explanation: Six-month trial; GLU is the glutaraldehyde/HEMA desensitizer, BIS an oxalate, PLA water.
  - reference: PMID:34013195
    reference_title: Comparative evaluation of the efficacy of the desensitizing and remineralizing agent in the reduction of dentin hypersensitivity after orthodontic debonding - a randomized clinical trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There was 98 percent reduction in DH between T0 and T3 and was statistically significant (p<0.05) for both the groups.
    explanation: Randomized trial of the 5% glutaraldehyde, 35% HEMA desensitizer after orthodontic debonding.
  - reference: PMID:15634299
    reference_title: In vitro dentine permeability evaluation of HEMA-based (desensitizing) products using split-chamber model following in vivo application in the dog.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The Gluma Desensitizing agent provide the more lasting tubule-occluding effect than the other material tested in this model.
    explanation: Animal model of tubule occlusion by a HEMA-based desensitizer.
regulatory_status:
- agency: FDA
  status: CLEARED
  regulation_number: '872.3200'
  regulation_title: Resin tooth bonding agent
  device_class: CLASS_II
  product_codes:
