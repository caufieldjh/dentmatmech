name: Hydroxyethyl methacrylate
creation_date: '2026-09-04T20:17:41Z'
curation_status: IN_PROGRESS
description: A dental restoration material which is a hydrophilic monomer used in dental adhesives
  and primers. HEMA is the monomethacrylate ester of ethylene glycol. It carries one polymerizable
  methacrylate group and one free hydroxyl, which makes it miscible with water and with the
  dimethacrylate resins of an adhesive. It is a component monomer rather than a finished restorative;
  its clinical uses and regulatory standing are those of the adhesives, primers, resin-modified glass
  ionomer cements, resin cements, and desensitizers that contain it.
