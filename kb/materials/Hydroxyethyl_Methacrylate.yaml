    explanation: Classification paragraph (b).
  - reference: url:https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpcd/classification.cfm?start_search=1&regulationnumber=872.3200
    reference_title: FDA Product Classification, regulation number 872.3200
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: agent, tooth bonding, resin
    explanation: Device name for product code KLE, class 2, submission type 510(k).
