properties:
- name: Tensile bond strength to dentine, HEMA and aldehyde primers
  property_type: BOND_STRENGTH
  value: 15 and 18
  unit: MPa
  test_method: Tensile bond test of restorative resin to EDTA-pretreated dentine
  conditions: Aqueous HEMA with propionic aldehyde (15) or glutaraldehyde (18)
  description: The original 1985 report of HEMA-based dentin bonding, reported as MN/m2 (1 MN/m2 = 1 MPa). The glutaraldehyde/HEMA mixture became the Gluma system.
  evidence:
  - reference: PMID:3926655
    reference_title: Bonding of restorative resins to dentine promoted by aqueous mixtures of aldehydes and active monomers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using an adhesive based on HEMA and propionic aldehyde or HEMA and glutaraldehyde bond strengths of 15 and 18 MN/m2, respectively, were obtained.
    explanation: Reported values.
  - reference: PMID:6430986
    reference_title: Bond strength between dentin and restorative resins mediated by mixtures of HEMA and glutaraldehyde.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Statistical analysis of the results from varying mixtures of HEMA and glutaraldehyde revealed that the bond strength was highly dependent on the HEMA concentration, with a maximum at 35%, and nearly independent of the glutaraldehyde concentration when greater than 3%."
    explanation: Bond strength depends on HEMA concentration in the aldehyde primer.
- name: Microtensile bond strength versus HEMA concentration, experimental one-step self-etch adhesives
  property_type: BOND_STRENGTH
  value: highest at 10% HEMA; lowest at 36% HEMA
  test_method: Micro-tensile bond strength, 24 h
  conditions: Bur-cut enamel and dentin; HEMA at 0, 10, 19, and 36% with acetone balance
  evidence:
  - reference: PMID:18433860
    reference_title: The role of HEMA in one-step self-etch adhesives.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Even though Exp-36 was the only adhesive formulation that did not exhibit phase separation on a glass plate, it yielded the lowest bond strength.
    explanation: Too much HEMA lowers bond strength even as it removes phase separation.
- name: Effect of dentin moisture on bonding of HEMA-containing universal adhesives
  property_type: BOND_STRENGTH
  value: higher on dry than on wet bur-cut dentin
  test_method: Micro-tensile bond strength, 24 h and after 10,000 thermal cycles
  conditions: Bur-cut dentin left wet or air dried 10 s
  evidence:
  - reference: PMID:34269543
    reference_title: Effect of Surface Moisture on Bur-cut Dentin on Bonding of HEMA-free and HEMA-containing Universal Adhesives with or without Methacrylamide Monomer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Dry surfaces enabled obtaining optimal bonding for HEMA-containing adhesives to bur-cut dentin, while wet surfaces enabled optimal bonding for HEMA-free adhesives.
    explanation: Handling factor that differs between HEMA-containing and HEMA-free adhesives.
- name: Degree of conversion versus HEMA content in an adhesive resin
  property_type: DEGREE_OF_CONVERSION
  value: 30% lower at 30 wt% HEMA and 61% lower at 50 wt% HEMA than a HEMA-free control
  test_method: FTIR degree of conversion at 40 s light activation
  conditions: Experimental bis-GMA, bis-EMA, TEGDMA blend with 0, 15, 30, or 50 wt% HEMA
  evidence:
  - reference: PMID:21594225
    reference_title: Influence of 2-hydroxyethyl methacrylate concentration on polymer network of adhesive resin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: At 40 s of light activation time, groups G30 and G50 showed a decrease of 30% and 61%, respectively, in degree of conversion compared to control.
    explanation: Reported values.
- name: Water sorption and solubility versus HEMA content
  property_type: WATER_SORPTION
  value: increases with HEMA content; highest at 50 wt% HEMA
  conditions: Experimental adhesive resin blends with 0, 15, 30, or 50 wt% HEMA
  description: HEMA-containing commercial one-step self-etch adhesives also take up more water with storage time than a HEMA-free adhesive.
  evidence:
  - reference: PMID:21594225
    reference_title: Influence of 2-hydroxyethyl methacrylate concentration on polymer network of adhesive resin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Water sorption and solubility differed for all groups, and was statistically higher in G50.
    explanation: Water sorption rises with HEMA content.
  - reference: PMID:21575671
    reference_title: Long-term evaluation of water sorption and ultimate tensile strength of HEMA-containing/-free one-step self-etch adhesives.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For the HEMA-containing adhesives, Wsp increased and UTS decreased over time.
    explanation: Three HEMA-containing commercial adhesives over 360 days of water storage, against one HEMA-free adhesive.
- name: Ultimate tensile strength of adhesive resin versus HEMA content and water storage
  property_type: TENSILE_STRENGTH
  value: lower at 30 and 50 wt% HEMA than at 0 and 15 wt%; falls with water storage in HEMA-containing adhesives
  evidence:
  - reference: PMID:21594225
    reference_title: Influence of 2-hydroxyethyl methacrylate concentration on polymer network of adhesive resin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For ultimate tensile strength, the control and G15 groups showed statistically higher values than the other groups (p < 0.05).
    explanation: Reported comparison.
  - reference: PMID:21594225
    reference_title: Influence of 2-hydroxyethyl methacrylate concentration on polymer network of adhesive resin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Higher HEMA content increases dental adhesive resin degradation.
    explanation: Authors' conclusion.
- name: Diffusion through dentin to the pulp chamber
  property_type: OTHER
  value: 0.5 to 13.3 recovered per cavity, depending on bonding system and remaining dentin thickness
  unit: microgram
  test_method: Gas chromatography/mass spectrometry of artificial pulp chamber contents
  conditions: Human molar dentin discs, remaining dentin thickness 0.25 or 0.5 mm
  description: HEMA released from bonding systems and resin cements crosses dentin; thinner dentin and phosphoric acid etching increase the amount.
  evidence:
  - reference: PMID:18028061
    reference_title: Dentin diffusion of HEMA released from etch-and-rinse and self-etch bonding systems.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The highest mean HEMA concentration was found in the 0.25 mm RDT group treated with OptiBond FL (13.3 microg) and the lowest mean HEMA concentration was detected in the 0.5 mm RDT group treated with AdheSE (0.5 microg).
    explanation: Reported range.
  - reference: PMID:18028061
    reference_title: Dentin diffusion of HEMA released from etch-and-rinse and self-etch bonding systems.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Etching with phosphoric acid increased the detected HEMA quantities compared with self-etch BS.
    explanation: Effect of etching on diffusion.
  - reference: PMID:26714346
    reference_title: Diffusion of HEMA from resin cements through different dentin thicknesses in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Decreasing RDT substantially increased the amount of HEMA that diffused through the dentin to the pulp space.
    explanation: Effect of remaining dentin thickness for resin cements.
- name: HEMA release from resin-modified glass ionomer cements
  property_type: OTHER
  value: up to 93.4 at 24 h (Vitremer)
  unit: ppm
  test_method: High performance liquid chromatography of deionized water eluates
  conditions: 10 x 1 mm specimens in 20 ml water; sampled at 10 min, 1 h, 24 h, and 7 days
  evidence:
  - reference: PMID:19826597
    reference_title: Water Absorption and HEMA Release of Resin-Modified Glass-Ionomers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Vitremer showed the highest HEMA release and water absorption values and Protec-Cem showed the lowest values.
    explanation: Comparison of three commercial RMGICs.
  - reference: PMID:26916063
    reference_title: HEMA release and degree of conversion from a resin-modified glass ionomer cement after various delays of light activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A delay in light-activation caused a significant increase in the cumulative HEMA release.
    explanation: Handling factor that governs HEMA release from RMGIC.
- name: Cytotoxicity and genotoxicity in vitro
  property_type: BIOCOMPATIBILITY
  value: DNA damage, apoptosis, and cell-cycle delay at millimolar concentrations; viability unaffected up to 10 mM over 1 h
  test_method: Comet assay, apoptosis and cell-cycle analysis
  conditions: Human peripheral blood lymphocytes and A549 cells
  description: The mechanism is oxidative stress. Glutathione is depleted, reactive oxygen species rise, and antioxidants such as N-acetylcysteine block the effect.
  evidence:
  - reference: PMID:20079459
    reference_title: Genotoxicity and cytotoxicity of 2-hydroxyethyl methacrylate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: HEMA induced apoptosis in a concentration-dependent manner and caused cell-cycle delay at the G0/G1-checkpoint.
    explanation: Reported effect.
  - reference: PMID:20079459
    reference_title: Genotoxicity and cytotoxicity of 2-hydroxyethyl methacrylate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: HEMA at concentrations up to 10mM neither affected the viability of the cells nor interacted with isolated plasmid DNA during a 1h exposure.
    explanation: Viability threshold in the same study.
  - reference: PMID:16998124
    reference_title: Genetic and cellular toxicology of dental resin monomers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Complementary, cytotoxic, and genotoxic effects of TEGDMA and HEMA are inhibited in the presence of ROS scavengers like N-acetylcysteine (NAC), ascorbate, and Trolox (vitamin E).
    explanation: Mechanism review; narrative review rather than a formal systematic review.
  - reference: PMID:24355064
    reference_title: "HEMA-induced cytotoxicity: oxidative stress, genotoxicity and apoptosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Most of them support the hypothesis that this compound, once released in the oral environment, increases reactive oxygen species (ROS) production and oxidative DNA damage through double-strand breaks evidenced by in vitro presence of micronuclei.
    explanation: Minireview of HEMA cytotoxicity mechanisms; narrative review.
clinical_performance:
- name: Retention and other clinical parameters, HEMA-containing versus HEMA-free adhesives in non-carious cervical lesions
  measure_type: RETENTION_RATE
  value: retention risk difference 0.03 [-0.01, 0.07], p = 0.13; no significant difference for any parameter
  population: 22 randomized controlled trials, 997 participants, non-carious cervical lesion restorations
  comparator: HEMA-free adhesive systems
  description: Meta-analysis. Marginal discoloration, marginal adaptation, caries, and postoperative sensitivity did not differ either.
  evidence:
  - reference: PMID:29649505
    reference_title: Do HEMA-free adhesive systems have better clinical performance than HEMA-containing systems in noncarious cervical lesions? A systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: HEMA-free and HEMA-containing adhesive systems showed a similar clinical performance in NCCL restorations.
    explanation: Conclusion of the meta-analysis.
  - reference: PMID:29649505
    reference_title: Do HEMA-free adhesive systems have better clinical performance than HEMA-containing systems in noncarious cervical lesions? A systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: no significant statistical difference was found between the clinical performances of HEMA-free and HEMA-containing adhesive systems for all parameters analyzed
    explanation: Pooled estimates; the risk differences and p values are in the value field.
- name: Retention, HEMA-free versus HEMA-containing adhesives in direct composite restorations, trials with at least 2 years follow-up
  measure_type: RETENTION_RATE
  value: no significant difference in the majority of included trials
  population: 7 clinical studies published 2013 to 2023, permanent dentition, at least 2-year follow-up
  comparator: HEMA-free adhesive systems
  description: The review raised concern over marginal adaptation and marginal discoloration, where trial results conflicted.
  evidence:
  - reference: PMID:39838443
    reference_title: "HEMA-free versus HEMA-containing adhesive systems: a systematic review."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: the majority of studies reported no significant difference between the two types of adhesives for the parameter of retention.
    explanation: Main result.
  - reference: PMID:39838443
    reference_title: "HEMA-free versus HEMA-containing adhesive systems: a systematic review."
    supports: PARTIAL
    evidence_source: SYSTEMATIC_REVIEW
    snippet: There was some concern about their influence on marginal adaptation and marginal discoloration due to the conflicted results reported by the included trials.
    explanation: The margin outcomes were inconsistent across trials.
- name: Clinical success at 14 years, HEMA-containing three-step etch-and-rinse adhesive versus HEMA-free one-step self-etch adhesive
  measure_type: SUCCESS_RATE
  value: 57.9% (HEMA-containing OptiBond FL) versus 58.9% (HEMA-free G-Bond)
  follow_up_years: 14.0
  population: 267 non-carious cervical lesions in 52 patients; recall rate 63% at 14 years
  comparator: HEMA-free one-step self-etch adhesive (G-Bond)
  description: Randomized controlled trial. Marginal deterioration was the main reason for failure, then loss of retention. Retention loss was 19.6% with the HEMA-containing adhesive and 19.4% with the HEMA-free one.
  evidence:
  - reference: PMID:37435814
    reference_title: Fourteen-year Clinical Performance of a HEMA-free One-step Self-etch Adhesive in Non-carious Cervical Lesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The overall clinical success rate was 58.9% and 57.9% for GB and OFL, respectively.
    explanation: GB is the HEMA-free adhesive; OFL is the HEMA-containing control.
  - reference: PMID:37435814
    reference_title: Fourteen-year Clinical Performance of a HEMA-free One-step Self-etch Adhesive in Non-carious Cervical Lesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 14 years, restorations bonded with the HEMA-free 1SEa performed as well as those bonded with the 3E&Ra gold standard."
    explanation: Conclusion.
adverse_effects:
- name: Allergic contact dermatitis in patients and dental personnel
  effect_category: ALLERGIC_OR_HYPERSENSITIVITY
  effect_term:
    preferred_term: allergic contact dermatitis
    term:
      id: MONDO:0006525
      label: allergic contact dermatitis
  frequency: Positive patch tests to (meth)acrylates in 2.3% of dental patients and 5.8% of dental personnel in a Swedish dental series; HEMA the most common allergen in both groups
  description: HEMA is the leading methacrylate contact allergen. It was added to the European baseline patch test series in 2019. Most current cases arise from nail cosmetics rather than dental products.
  evidence:
  - reference: PMID:37752620
    reference_title: "2-Hydroxyethyl methacrylate (HEMA): A clinical review of contact allergy and allergic contact dermatitis-Part 1. Introduction, epidemiology, case series and case reports."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HEMA is an important cause of contact allergy/allergic contact dermatitis in North America and Europe with recent prevalences of >3% in the USA + Canada and 1.5%-3.7% in Europe."
    explanation: Population prevalence of HEMA contact allergy among patch-tested patients; narrative review.
  - reference: PMID:37752620
    reference_title: "2-Hydroxyethyl methacrylate (HEMA): A clinical review of contact allergy and allergic contact dermatitis-Part 1. Introduction, epidemiology, case series and case reports."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 2-Hydroxyethyl methacrylate (HEMA) has been increasingly recognised as a contact allergen and was added to the European baseline series in 2019.
    explanation: Recognition as a baseline allergen; narrative review.
  - reference: PMID:16958920
    reference_title: "Contact allergy to (meth)acrylates in the dental series in southern Sweden: simultaneous positive patch test reaction patterns and possible screening allergens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Positive patch tests to (meth)acrylate allergens were seen in 2.3% (30/1322) of the dental patients and 5.8% (18/310) of the dental personnel.
    explanation: Frequencies in a dental patch test series.
  - reference: PMID:16958920
    reference_title: "Contact allergy to (meth)acrylates in the dental series in southern Sweden: simultaneous positive patch test reaction patterns and possible screening allergens."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common allergen for both groups was 2-hydroxyethyl methacrylate (2-HEMA), followed by ethyleneglycol dimethacrylate (EGDMA), triethyleneglycol dimethacrylate, and methyl methacrylate.
    explanation: HEMA ranks first among dental (meth)acrylate allergens.
- name: Cross-sensitization and atypical manifestations of HEMA allergy
  effect_category: ALLERGIC_OR_HYPERSENSITIVITY
  effect_term:
    preferred_term: allergic contact dermatitis
    term:
      id: MONDO:0006525
      label: allergic contact dermatitis
  description: Primary HEMA sensitization cross-reacts with ethylene glycol dimethacrylate and hydroxypropyl methacrylate. Rare forms include lichen planus, systemic contact dermatitis, and respiratory disease.
  evidence:
  - reference: PMID:37778325
    reference_title: "2-Hydroxyethyl methacrylate (HEMA): A clinical review of contact allergy and allergic contact dermatitis. Part 2. Cross- and co-sensitization, other skin reactions to HEMA, position of HEMA among (meth)acrylates, sensitivity as screening agent, presence of HEMA in commercial products and practical information on patch test procedures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is a strong cross-allergy between HEMA, ethylene glycol dimethacrylate (EGDMA), and hydroxypropyl methacrylate; many reactions to EGDMA are cross-reactions to primary HEMA sensitization."
    explanation: Cross-reaction pattern; narrative review.
  - reference: PMID:37778325
    reference_title: "2-Hydroxyethyl methacrylate (HEMA): A clinical review of contact allergy and allergic contact dermatitis. Part 2. Cross- and co-sensitization, other skin reactions to HEMA, position of HEMA among (meth)acrylates, sensitivity as screening agent, presence of HEMA in commercial products and practical information on patch test procedures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Rare atypical manifestations of HEMA-allergy include lichen planus, lymphomatoid papulosis, systemic contact dermatitis, leukoderma after positive patch tests, and systemic side effects such as nausea, diarrhoea, malaise, and palpitations.
    explanation: Atypical presentations; narrative review.
  - reference: PMID:37778325
    reference_title: "2-Hydroxyethyl methacrylate (HEMA): A clinical review of contact allergy and allergic contact dermatitis. Part 2. Cross- and co-sensitization, other skin reactions to HEMA, position of HEMA among (meth)acrylates, sensitivity as screening agent, presence of HEMA in commercial products and practical information on patch test procedures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: HEMA is the most frequently patch test-positive methacrylate.
    explanation: Position among methacrylate allergens; narrative review.
- name: Occupational sensitization of dentists, dental nurses, and technicians
  effect_category: OCCUPATIONAL
  effect_term:
    preferred_term: occupational dermatitis
    term:
      id: MONDO:0006589
      label: occupational dermatitis
  description: HEMA penetrates common examination gloves. Safety data sheets of dental products name their methacrylates only about half the time, which hampers risk assessment for staff.
  evidence:
  - reference: PMID:17937748
    reference_title: Methacrylate and acrylate allergy in dental personnel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 2-HEMA was the most important allergen in dentists and dental nurses, and MMA and EGDMA in dental technicians.
    explanation: Finnish occupational patch test series, 1994 to 2006.
  - reference: PMID:14632691
    reference_title: On permeability of methyl methacrylate, 2-hydroxyethyl methacrylate and triethyleneglycol dimethacrylate through protective gloves in dentistry.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Methacrylate monomers are potent contact allergens, and it is known that these substances may penetrate the glove materials commonly used.
    explanation: Glove permeation as the exposure route.
  - reference: PMID:14632691
    reference_title: On permeability of methyl methacrylate, 2-hydroxyethyl methacrylate and triethyleneglycol dimethacrylate through protective gloves in dentistry.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A neoprene glove seemed to be the best choice for protection against penetration of HEMA and TEGDMA.
    explanation: Protective measure.
  - reference: PMID:15186380
    reference_title: Methacrylates in dental restorative materials.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Information about methacrylates was given in the safety data sheets (SDSs) for about half of the products that according to the analysis results contained methacrylates.
    explanation: Labeling gap that affects occupational risk assessment.
  - reference: PMID:19826597
    reference_title: Water Absorption and HEMA Release of Resin-Modified Glass-Ionomers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This release may be relevant both to the risk of adverse pulpal responses in patients and to the risk of allergy in patients and dental personnel.
    explanation: HEMA release from RMGIC as an exposure source.
- name: Pulpal cytotoxicity and inflammatory signaling after diffusion through dentin
  effect_category: PULPAL_RESPONSE
  description: HEMA reaches the pulp chamber through dentin. In pulp cells it is cytotoxic at millimolar
    concentrations, raises IL-6 and IL-8, and blunts the immune response to bacterial products. One
    diffusion study judged the eluted amounts to be below cytotoxic levels. No clinical frequency of
    HEMA-attributable pulpitis was found.
  evidence:
  - reference: PMID:21899564
    reference_title: Overexpression of interleukin-6 and -8, cell growth inhibition and morphological changes in 2-hydroxyethyl methacrylate-treated human dental pulp mesenchymal stem cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 2-Hydroxyethyl methacrylate exhibited cytotoxicity, inhibited cell growth and induced morphological changes in cultured DP-MSCs.
    explanation: Human dental pulp mesenchymal stem cells at 3 and 5 mmol/L.
  - reference: PMID:35341601
    reference_title: Influence of HEMA on LPS- and LTA-stimulated IL-6 release from human dental pulp cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The protective immune response in odontoblasts and pulp fibroblasts is impaired by monomers such as HEMA through the disturbance of the redox homeostasis.
    explanation: Immune impairment in pulp cells.
  - reference: PMID:26714346
    reference_title: Diffusion of HEMA from resin cements through different dentin thicknesses in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: HEMA was detected in the pulp chamber elutes of all the teeth.
    explanation: Exposure route.
  - reference: PMID:23107279
    reference_title: Diffusion of HEMA through human carious and non-carious dentin in vitro.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: The highest amount of eluted HEMA concentration detected was not viewed as critical for pulp tissue since the diffused HEMA amounts were below the level of cytotoxicity, according to the literature.
    explanation: Eluted amounts through about 1.2 mm of dentin were judged sub-cytotoxic.
  - reference: PMID:18539324
    reference_title: The biocompatibility of resin-modified glass-ionomer cements for dentistry.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: HEMA is known to be released from these materials and has a variety of damaging biological properties, ranging from pulpal inflammation to allergic contact dermatitis.
    explanation: Review of HEMA release from RMGIC; narrative review.
- name: Genotoxicity via oxidative DNA damage
  effect_category: TOXICITY
  description: In vitro only. Oxidative base damage, apoptosis, and G0/G1 delay at millimolar concentrations; the DNA damage at 10 mM was repaired within 120 minutes.
  evidence:
  - reference: PMID:20079459
    reference_title: Genotoxicity and cytotoxicity of 2-hydroxyethyl methacrylate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results obtained in this study suggest that HEMA induces adverse biological effects, mainly via reactive oxygen species, which can lead to DNA damage, apoptosis and cell-cycle delay.
    explanation: Mechanism and endpoints.
  - reference: PMID:16998124
    reference_title: Genetic and cellular toxicology of dental resin monomers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The formation of micronuclei is indicative of chromosomal damage and the induction of DNA strand breaks detected with monomers like TEGDMA and 2-hydroxyethyl methacrylate (HEMA).
    explanation: Review of genotoxicity findings; narrative review.
- name: Hydrolytic degradation of the adhesive interface
  effect_category: MECHANICAL_FAILURE
  description: HEMA-rich simplified adhesives are permeable to water, take up water over time, and lose strength. This is the argument for HEMA-free formulations. Clinical retention data do not yet show a difference.
  evidence:
  - reference: PMID:14653938
    reference_title: Have dentin adhesives become too hydrophilic?
    supports: SUPPORT
    evidence_source: OTHER
    snippet: When primers are mixed with adhesives in 2-step single-bottle adhesives and self-etching primers, the adhesives are more permeable to water and hence absorb more water over time than previous generations of adhesives.
    explanation: Narrative review of the hydrophilicity problem.
  - reference: PMID:21575671
    reference_title: Long-term evaluation of water sorption and ultimate tensile strength of HEMA-containing/-free one-step self-etch adhesives.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For the HEMA-containing adhesives, Wsp increased and UTS decreased over time.
    explanation: Loss of strength with water storage.
  - reference: PMID:29574280
    reference_title: Glycerol-dimethacrylate as alternative hydrophilic monomer for HEMA replacement in simplified adhesives.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The nanoleakage was higher and gaps were found in the interface of HEMA-containing adhesives, which were less present in GDMA equivalents.
    explanation: Interfacial defects in HEMA-containing model adhesives.
  - reference: PMID:29649505
    reference_title: Do HEMA-free adhesive systems have better clinical performance than HEMA-containing systems in noncarious cervical lesions? A systematic review and meta-analysis.
    supports: PARTIAL
    evidence_source: SYSTEMATIC_REVIEW
    snippet: Only the presence of HEMA does not indicate better clinical performance of adhesive systems.
    explanation: Clinical retention does not reflect the in vitro degradation; the meta-analysis found no difference between HEMA-containing and HEMA-free adhesives.
- name: Reduced biocompatibility of resin-modified glass ionomer hosts
  effect_category: TOXICITY
  description: The HEMA in resin-modified glass ionomer cements is the reason these cements are held to be less biocompatible than conventional glass ionomers.
  evidence:
  - reference: PMID:18539324
    reference_title: The biocompatibility of resin-modified glass-ionomer cements for dentistry.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Resin-modified glass-ionomers cannot be considered biocompatible to nearly the same extent as conventional glass-ionomers.
    explanation: Conclusion of the review; narrative review.
