  special_controls:
  - 'Class II Special Controls Guidance Document: Root-Form Endosseous Dental Implants and Endosseous Dental Implant Abutments'
  identification: An endosseous dental implant is a prescription device made of a material such as titanium or titanium alloy that is intended to be surgically placed in the bone of the upper or lower jaw arches to provide support for prosthetic devices, such as artificial teeth, in order to restore a patient's chewing function.
