  restrictions:
  - Prescription device
  source_url: https://www.ecfr.gov/current/title-21/section-872.3640
  notes: This regulation governs the implant as a device, of which titanium is the named material. Product codes are DZE (root-form), NRQ (blade-form), and OAT (orthodontic endosseous implant). Titanium crowns and frameworks fall under other regulations not yet recorded.
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3640
    reference_title: 21 CFR 872.3640 Endosseous dental implant
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: "The root-form endosseous dental implant is characterized by four geometrically distinct types: Basket, screw, solid cylinder, and hollow cylinder."
    explanation: Root-form implants are class II with special controls.
