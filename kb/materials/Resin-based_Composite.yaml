name: Resin-based composite
creation_date: '2026-09-04T20:17:41Z'
curation_status: IN_PROGRESS
description: A dental restoration material that is primarily composed of highly cross-linked
  organic polymeric matrix reinforced by filler particles and/or short fibers bound to the
  matrix by coupling agents and set by light and or chemically activated polymerization reaction.
material_term:
  preferred_term: Resin-based composite
  term:
    id: OHD:0000036
    label: resin-based composite dental restoration material
category: RESIN_COMPOSITE
parents:
- Dental restoration material
synonyms:
- composite resin
- dental composite
- tooth-colored filling
- white filling
setting_mechanisms:
- LIGHT_CURED
- SELF_CURED
- DUAL_CURED
composition:
- name: Bis-GMA
  role: MATRIX
  chemical:
    preferred_term: bisphenol A glycidyl methacrylate (Bis-GMA)
    description: A dimethacrylate monomer; CHEBI has no exact term, so the chemical is left unbound.
  description: Archetypal base monomer of the polymer matrix.
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3690
    reference_title: 21 CFR 872.3690 Tooth shade resin material
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: composed of materials such as bisphenol-A glycidyl methacrylate (Bis-GMA)
    explanation: The FDA identification names Bis-GMA as the archetypal matrix monomer.
- name: Diluent dimethacrylate monomers (e.g. TEGDMA, UDMA)
  role: MATRIX
  chemical:
    preferred_term: methacrylate monomers
    term:
      id: CHEBI:25218
      label: methacrylate
  description: Lower-viscosity monomers blended with Bis-GMA to control handling.
- name: Inorganic filler (silica, glass, zirconia-silica)
  role: FILLER
  chemical:
    preferred_term: silica
    term:
      id: CHEBI:30563
      label: silicon dioxide
  proportion: typically 60-80 wt% depending on type
- name: Silane coupling agent
  role: COUPLING_AGENT
  description: Bonds filler particles to the polymer matrix.
- name: Photoinitiator system (e.g. camphorquinone with amine co-initiator)
  role: INITIATOR
clinical_uses:
- name: Direct anterior and posterior restorations
  use_context: DIRECT_RESTORATION
  procedure:
    preferred_term: resin filling
    term:
      id: OHD:0000042
      label: resin filling restoration procedure
  anatomical_site:
    preferred_term: tooth
    term:
      id: UBERON:0001091
      label: calcareous tooth
  indications:
  - Restoration of carious lesions or structural defects in teeth
  contraindications:
  - Inability to achieve adequate moisture control during placement
  evidence:
  - reference: PMID:21093034
    reference_title: Resin composite--state of the art.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: the commercial materials that comprise the current armamentarium are of high quality and when used appropriately, have proven to deliver excellent clinical outcomes of adequate longevity
    explanation: Summarizes the clinical standing of current composites.
- name: Indirect inlays, onlays, and veneers
  use_context: INDIRECT_RESTORATION
  procedure:
    preferred_term: resin inlay
    term:
      id: OHD:0000096
      label: resin inlay restoration procedure
properties:
- name: Polymerization shrinkage and shrinkage stress
  property_type: POLYMERIZATION_SHRINKAGE
  description: The main materials-science problem of the class; recent development has focused on reducing it.
  evidence:
  - reference: PMID:21093034
    reference_title: Resin composite--state of the art.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: The more recent research and development efforts have addressed the issue of polymerization shrinkage and its accompanying stress, which may have a deleterious effect on the composite/tooth interfacial bond.
    explanation: Names shrinkage stress as the issue and its consequence at the bond.
clinical_performance:
- name: Main reasons for failure, posterior restorations
  measure_type: COMPLICATION_RATE
  value: caries and fracture
  follow_up_years: 5
  population: Direct posterior resin composite restorations in 12 longitudinal studies with at least 5 years of follow-up (2,816 restorations)
  description: Failure risk was higher in high-caries-risk individuals and with more restored surfaces.
  evidence:
  - reference: PMID:25048250
    reference_title: 'Longevity of posterior composite restorations: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: Main reasons for failure were caries and fracture. The regression analyses showed a significantly higher risk of failure for restorations in high-caries-risk individuals and those with a higher number of restored surfaces.
    explanation: Pooled individual-participant analysis of failure reasons and risk factors.
- name: Failure and secondary caries relative to amalgam, posterior permanent teeth
  measure_type: SURVIVAL_RATE
  value: 'RR 1.89 (95% CI 1.52 to 2.35) for failure; RR 2.14 (95% CI 1.67 to 2.74) for secondary caries'
  follow_up_years: 3
  population: Randomized trials in permanent posterior teeth with at least three years of follow-up
  comparator: Amalgam
  evidence:
  - reference: PMID:24683067
    reference_title: Direct composite resin fillings versus amalgam fillings for permanent or adult posterior teeth.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: increased risk of secondary caries (RR 2.14, 95% CI 1.67 to 2.74, P value < 0.001 (low-quality evidence)) but no evidence of an increased risk of restoration fracture (RR 0.87, 95% CI 0.46 to 1.64, P value = 0.66 (moderate-quality evidence))
    explanation: Cochrane estimates for secondary caries and fracture versus amalgam.
adverse_effects:
- name: Secondary caries at the margin
  effect_category: SECONDARY_CARIES
  effect_term:
    preferred_term: caries
    term:
      id: HP:0000670
      label: Carious teeth
  description: The leading failure reason in long-term posterior studies, and higher than amalgam in trials.
  evidence:
  - reference: PMID:25048250
    reference_title: 'Longevity of posterior composite restorations: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: Main reasons for failure were caries and fracture.
    explanation: Caries is named first among the failure reasons.
