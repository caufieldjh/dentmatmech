name: Glass ionomer cement
creation_date: '2026-09-04T20:17:41Z'
curation_status: IN_PROGRESS
description: An acid-base cement dental restoration material containing basic ion-leachable
  glass (fluoroaluminosilicate glass) as a powder component with polymeric water-soluble acid
  (polyacrylic acid, polyprotic carboxylic acid) as liquid component to complete the acid-base
  reaction.
material_term:
  preferred_term: Glass ionomer cement
  term:
    id: OHD:0001006
    label: glass ionomer cement dental restoration material
category: CEMENT
parents:
- Acid-base cement
synonyms:
- GIC
- glass-ionomer
- glass polyalkenoate cement
setting_mechanisms:
- ACID_BASE_REACTION
composition:
- name: Fluoroaluminosilicate glass
  role: POWDER
  description: Basic, ion-leachable glass powder; also the fluoride source.
- name: Polyacrylic acid
  role: LIQUID
  chemical:
    preferred_term: poly(acrylic acid)
    term:
      id: CHEBI:61372
      label: poly(acrylic acid) polymer
  description: Water-soluble polymeric acid that attacks the glass to set the cement.
- name: Fluoride
  role: FLUORIDE_SOURCE
  description: Released from the glass phase over time.
  evidence:
  - reference: PMID:27367737
    reference_title: A Review of Glass-Ionomer Cements for Clinical Dentistry.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: They release fluoride and are bioactive, so that they gradually develop a strong, durable interfacial ion-exchange layer at the interface with the tooth, which is responsible for their adhesion.
    explanation: Fluoride release and the ion-exchange adhesion mechanism.
properties:
- name: Setting time
  property_type: SETTING_TIME
  value: '2-3'
  unit: min
  evidence:
  - reference: PMID:27367737
    reference_title: A Review of Glass-Ionomer Cements for Clinical Dentistry.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: Glass-ionomers are shown to set by an acid-base reaction within 2-3 min and to form hard, reasonably strong materials with acceptable appearance.
    explanation: Setting time and mechanism.
- name: Fluoride release
  property_type: FLUORIDE_RELEASE
  description: Sustained release; the basis for the caries-protective claim.
clinical_uses:
- name: Luting of crowns, bridges, and orthodontic bands
  use_context: LUTING
- name: Base or liner under restorations
  use_context: LINER_OR_BASE
- name: Direct restoration in low-stress sites and primary teeth
  use_context: DIRECT_RESTORATION
  anatomical_site:
    preferred_term: tooth
    term:
      id: UBERON:0001091
      label: calcareous tooth
  indications:
  - Cervical (Class V) lesions
  - Restorations in primary teeth
  - Atraumatic restorative treatment
regulatory_status:
- agency: FDA
  status: CLEARED
  regulation_number: '872.3275'
  regulation_title: Dental cement (other than zinc oxide-eugenol)
  device_class: CLASS_II
  product_codes:
  - EMA
  pathways:
  - PREMARKET_NOTIFICATION_510K
  identification: Dental cement other than zinc oxide-eugenol is a device composed of various materials other than zinc oxide-eugenol intended to serve as a temporary tooth filling or as a base cement to affix a temporary tooth filling, to affix dental devices such as crowns or bridges, or to be applied to a tooth to protect the tooth pulp.
  approved_uses:
  - name: Temporary tooth filling
    use_context: TEMPORARY
  - name: Base cement to affix a temporary tooth filling
    use_context: LINER_OR_BASE
  - name: Affixing dental devices such as crowns or bridges
    use_context: LUTING
  - name: Application to a tooth to protect the pulp
    use_context: LINER_OR_BASE
  source_url: https://www.ecfr.gov/current/title-21/section-872.3275
  notes: Glass ionomer marketed as a permanent restorative is often cleared under 872.3690 (tooth shade resin material, EBF) instead; check the product's 510(k) record.
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3275
    reference_title: 21 CFR 872.3275 Dental cement
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: Dental cement other than zinc oxide-eugenol is a device composed of various materials other than zinc oxide-eugenol
    explanation: The non-ZOE branch of the dental cement regulation is class II.
  - reference: url:https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpcd/classification.cfm?start_search=1&regulationnumber=872.3275
    reference_title: FDA Product Classification Database, regulation 872.3275
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: EMA Cement, dental 2 872.3275
    explanation: Product code EMA, class 2, on 2026-09-04.
standards:
- identifier: ISO 9917-1
  title: Dentistry - Water-based cements - Part 1 - Powder/liquid acid-base cements
  organization: ISO
