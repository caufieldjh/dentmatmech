name: Mineral trioxide aggregate cement
creation_date: '2026-09-04T20:17:41Z'
curation_status: IN_PROGRESS
description: A dental restoration material that primarily consists of tricalcium silicate,
  dicalcium silicate (similar to Portland cement), calcium aluminate, gypsum, radiopacifiers
  and set by hydration of silicates in the presence of moisture.
material_term:
  preferred_term: Mineral trioxide aggregate cement
  term:
    id: OHD:00001025
    label: mineral trioxide aggregate cement dental restoration material
category: CEMENT
parents:
- Dental restoration material
synonyms:
- MTA
- mineral trioxide aggregate
- calcium silicate cement
setting_mechanisms:
- HYDRATION
composition:
- name: Tricalcium silicate
  role: POWDER
  description: Principal hydraulic phase.
- name: Dicalcium silicate
  role: POWDER
- name: Bismuth oxide (radiopacifier)
  role: RADIOPACIFIER
  description: Added for radiopacity; implicated in discoloration.
- name: Water
  role: LIQUID
clinical_uses:
- name: Root-end filling
  use_context: ENDODONTIC
  procedure:
    preferred_term: apicoectomy
    term:
      id: OHD:0000241
      label: apicoectomy procedure
  anatomical_site:
    preferred_term: tooth root
    term:
      id: UBERON:0003677
      label: tooth root
  evidence:
  - reference: PMID:20171353
    reference_title: 'Mineral trioxide aggregate: a comprehensive literature review--Part III: Clinical applications, drawbacks, and mechanism of action.'
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: MTA is a promising material for root-end filling, perforation repair, vital pulp therapy, and apical barrier formation for teeth with necrotic pulps and open apexes.
    explanation: Lists the four established applications.
- name: Perforation repair
  use_context: ENDODONTIC
- name: Vital pulp therapy (pulp capping, pulpotomy)
  use_context: PULP_THERAPY
  procedure:
    preferred_term: pulp capping
    term:
      id: OHD:0000286
      label: pulp capping procedure
  anatomical_site:
    preferred_term: dental pulp
    term:
      id: UBERON:0001754
      label: dental pulp
- name: Apical barrier formation in teeth with necrotic pulps and open apexes
  use_context: ENDODONTIC
properties:
- name: Setting time
  property_type: SETTING_TIME
  description: Long; named as a drawback.
  evidence:
  - reference: PMID:20171353
    reference_title: 'Mineral trioxide aggregate: a comprehensive literature review--Part III: Clinical applications, drawbacks, and mechanism of action.'
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: MTA has some known drawbacks such as a long setting time, high cost, and potential of discoloration.
    explanation: Setting time named among the drawbacks.
adverse_effects:
- name: Tooth discoloration
  effect_category: ESTHETIC
  description: Potential for discoloration, attributed largely to the bismuth oxide radiopacifier in the original formulation.
  evidence:
  - reference: PMID:20171353
    reference_title: 'Mineral trioxide aggregate: a comprehensive literature review--Part III: Clinical applications, drawbacks, and mechanism of action.'
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: MTA has some known drawbacks such as a long setting time, high cost, and potential of discoloration.
    explanation: Discoloration named among the drawbacks.
regulatory_status:
- agency: FDA
  status: UNKNOWN
  notes: MTA products have been cleared through 510(k) under endodontic regulations (root canal filling resin, 872.3820, and related product codes) rather than a material-specific regulation. The specific regulation and product codes for representative products have not yet been verified against the FDA database, so no class is recorded here.
standards:
- identifier: ISO 6876
  title: Dentistry - Root canal sealing materials
  organization: ISO
