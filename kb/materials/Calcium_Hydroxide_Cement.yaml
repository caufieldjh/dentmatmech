adverse_effects:
- name: Cytotoxicity of soluble extracts
  effect_category: TOXICITY
  description: Soluble material from a hard-setting calcium hydroxide formulation is highly cytotoxic to cultured cells in vitro.
  evidence:
  - reference: PMID:22519883
    reference_title: Chlorhexidine, ethanol, lipopolysaccharide and nicotine do not enhance the cytotoxicity of a calcium hydroxide pulp capping material.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Calcium hydroxide in a formulation used in dental clinical procedures is highly cytotoxic to cultured cells, as evidenced by several cellular assays.
    explanation: In vitro cytotoxicity of a commercial hard-setting calcium hydroxide.
