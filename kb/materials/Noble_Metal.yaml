  special_controls:
  - 'Class II Special Controls Guidance Document: Dental Noble Metal Alloys'
  identification: A noble metal alloy is a device composed primarily of noble metals, such as gold, palladium, platinum, or silver, that is intended for use in the fabrication of cast or porcelain-fused-to-metal crown and bridge restorations.
  approved_uses:
  - name: Fabrication of cast crown and bridge restorations
    use_context: INDIRECT_RESTORATION
  - name: Fabrication of porcelain-fused-to-metal crown and bridge restorations
    use_context: INDIRECT_RESTORATION
  source_url: https://www.ecfr.gov/current/title-21/section-872.3060
  notes: Product code EJT is gold-based noble metal alloy; EJS is other noble metal alloy.
  evidence:
