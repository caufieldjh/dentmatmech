adverse_effects:
- name: Element release through corrosion
  effect_category: TOXICITY
  description: Corrosion is the single most relevant property for biologic safety; noble and high-noble single-phase alloys release the least.
  evidence:
  - reference: PMID:10668036
    reference_title: 'Biocompatibility of dental casting alloys: a review.'
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: The single most relevant property of a casting alloy to its biologic safety is its corrosion.
    explanation: Frames corrosion as the driver of biologic risk.
  - reference: PMID:10668036
    reference_title: 'Biocompatibility of dental casting alloys: a review.'
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: This goal can be achieved by using high-noble or noble alloys with single-phase microstructures.
    explanation: Noble alloys are the low-release choice.
regulatory_status:
- agency: FDA
  status: EXEMPT
  regulation_number: '872.3060'
  regulation_title: Noble metal alloy
  device_class: CLASS_II
  product_codes:
  - EJS
