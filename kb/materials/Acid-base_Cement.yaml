name: Acid-base cement
creation_date: '2026-09-04T20:17:41Z'
curation_status: IN_PROGRESS
description: A dental restoration material that sets by the neutralisation of an acidic
  liquid by a basic, acid-reactive powder, in water, to give a salt matrix binding the
  unreacted powder core. The class covers zinc phosphate, zinc polycarboxylate, zinc
  oxide and glass polyalkenoate (glass ionomer) cements, and is distinguished from the
  resin cements, which set by polymerisation rather than by an acid-base reaction.
material_term:
  preferred_term: Acid-base cement
  term:
    id: OHD:0001021
    label: acid-base cement dental restoration material
category: CEMENT
parents:
- Dental restoration material
synonyms:
- water-based cement
- powder/liquid acid-base cement
setting_mechanisms:
- ACID_BASE_REACTION
composition:
- name: Acid-reactive basic powder
  role: POWDER
  description: The basic half of the acid-base pair. A metal oxide in the zinc-based
    members and an ion-leachable aluminosilicate glass in the glass polyalkenoate members.
    Only partly consumed by the reaction; the residual core acts as the reinforcing filler.
  evidence:
  - reference: url:https://www.fda.gov/regulatory-information/search-fda-guidance-documents/dental-cements-performance-criteria-safety-and-performance-based-pathway
    reference_title: 'FDA guidance, Dental Cements - Performance Criteria for Safety and
      Performance Based Pathway (September 2024)'
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: 'dental cements are categorized on the basis of their chemical composition
      as follows: · Zinc phosphate cement · Zinc polycarboxylate cement · Glass polyalkenoate
      cement'
    explanation: FDA, describing the scope of ISO 9917-1, enumerates the three compositional
      families that make up the powder/liquid acid-base class.
- name: Zinc oxide
  role: POWDER
  chemical:
    preferred_term: zinc oxide
    term:
      id: CHEBI:36560
      label: zinc oxide
  description: The basic powder of the zinc-based members of the class (zinc phosphate,
    zinc polycarboxylate, zinc oxide and zinc oxide-eugenol cements).
  evidence:
  - reference: PMID:12628437
    reference_title: Erosion of water-based cements evaluated by volumetric and gravimetric
      methods.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: It appears that zinc oxide is dissolved leaving a spongy matrix which easily
      collapses under the force applied to the dial gauge during measurement.
    explanation: Identifies zinc oxide as the dissolvable powder phase of the zinc-based
      members of the class.
- name: Acidic liquid
  role: LIQUID
  description: The acidic half of the pair. An aqueous inorganic acid in zinc phosphate
    cement and an aqueous polyalkenoic (polycarboxylic) acid in polycarboxylate and glass
    polyalkenoate cements. It is the component responsible for the class-level concern
    about pulpal irritation.
- name: Phosphoric acid
  role: LIQUID
  chemical:
    preferred_term: phosphoric acid
    term:
      id: CHEBI:26078
      label: phosphoric acid
  description: The acidic liquid of zinc phosphate cement, buffered with aluminium and
    zinc salts.
  evidence:
  - reference: PMID:2269210
    reference_title: '[Pulp toxicity of the acid components of acid-base reaction cements].'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The phosphoric acid of Tenet causes an almost complete collapse of the incisal
      microcirculation just a short time after its application.
    explanation: Names phosphoric acid as the acid component of a member of the class;
      rat model, laser-Doppler flowmetry.
- name: Poly(acrylic acid)
  role: LIQUID
  chemical:
    preferred_term: poly(acrylic acid)
    term:
      id: CHEBI:61372
      label: poly(acrylic acid) polymer
  description: The polymeric acid of the polycarboxylate and glass polyalkenoate members.
  evidence:
  - reference: PMID:10941918
    reference_title: Use of Raman spectroscopy in the characterisation of the acid-base
      reaction in glass-ionomer cements.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mixtures containing the glass, PAA and water in mass ratios 2:1:(0.1-4) reacted
      to form polyacrylate salts.
    explanation: Poly(acrylic acid) is consumed to form the polyacrylate salt matrix.
- name: Water
  role: SOLVENT
  chemical:
    preferred_term: water
    term:
      id: CHEBI:15377
      label: water
  description: The reaction medium in which the neutralisation proceeds, and the reason
    the class is also called the water-based cements. Loss or gain of water during setting
    changes the properties of the set cement.
  evidence:
  - reference: PMID:10941918
    reference_title: Use of Raman spectroscopy in the characterisation of the acid-base
      reaction in glass-ionomer cements.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The data are consistent with 5.6 moles of water being required when each mole
      of acidic groups is neutralised.
    explanation: Quantifies the stoichiometric role of water in the setting neutralisation.
properties:
- name: Net setting time
  property_type: SETTING_TIME
  value: 1.5-8
  unit: min
  test_method: ISO 9917-1
  conditions: FDA performance criteria for the Safety and Performance Based Pathway; the
    range spans zinc phosphate, zinc polycarboxylate and glass polyalkenoate cements for
    luting and for base/lining applications.
  description: Luting applications allow up to 8 min; base/lining applications up to 6
    min. The lower bound is 2.5 min for zinc phosphate and zinc polycarboxylate luting
    cements and 1.5 min for glass polyalkenoate.
  evidence:
  - reference: url:https://www.fda.gov/regulatory-information/search-fda-guidance-documents/dental-cements-performance-criteria-safety-and-performance-based-pathway
    reference_title: 'FDA guidance, Dental Cements - Performance Criteria for Safety and
      Performance Based Pathway (September 2024)'
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: Zinc Phosphate 2.5 min ≤ tsetting ≤ 8 min 2 min ≤ tsetting ≤ 6 min Zinc Polycarboxylate
      2.5 min ≤ tsetting ≤ 8 min 2 min ≤ tsetting ≤ 6 min Glass Polyalkenoate 1.5 min ≤
      tsetting ≤ 8 min 1.5 min ≤ tsetting ≤ 6 min
    explanation: Table 2, net setting time performance criteria, luting and base/lining
      columns.
- name: Compressive strength
  property_type: COMPRESSIVE_STRENGTH
  value: '>=50'
  unit: MPa
  test_method: ISO 9917-1
  conditions: FDA performance criterion for powder/liquid acid-base cements.
  description: The minimum the three compositional families must meet. Measured values
    for marketed cements vary widely and rise with time after mixing.
  evidence:
  - reference: url:https://www.fda.gov/regulatory-information/search-fda-guidance-documents/dental-cements-performance-criteria-safety-and-performance-based-pathway
    reference_title: 'FDA guidance, Dental Cements - Performance Criteria for Safety and
      Performance Based Pathway (September 2024)'
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: '· Zinc phosphate: ≥50 MPa · Zinc polycarboxylate: ≥50 MPa'
    explanation: Compressive strength performance criteria, applicable to powder/liquid
      acid-base cements only.
  - reference: PMID:11641841
    reference_title: Laboratory strength of glass ionomer and zinc phosphate cements.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Compressive strengths varied widely between the 3 times of measurement from
      5.8 +/- 6.6 MPa for Ketac Cem to 144.3 +/- 10.2 MPa for Ketac Silver.
    explanation: Measured spread across glass ionomer and zinc phosphate cements, showing
      the strong dependence on time after mixing.
- name: Diametral tensile strength
  property_type: TENSILE_STRENGTH
  value: 4.4-11.5
  unit: MPa
  test_method: Diametral compression
  conditions: Commercial glass ionomer, cermet and zinc phosphate cements, 15 min to 24
    h after mixing.
  evidence:
  - reference: PMID:11641841
    reference_title: Laboratory strength of glass ionomer and zinc phosphate cements.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Diametral tensile strengths ranged widely from 4.4 +/- 0.9 MPa for Ketac Cem
      to 11.5 +/- 2.2 MPa for Chelon Silver.
    explanation: Tensile strength is an order of magnitude below compressive strength,
      which is why the class is confined to compressive-load applications.
- name: Acid erosion
  property_type: SOLUBILITY
  value: <=0.17-0.40
  unit: mm
  test_method: ISO 9917-1
  conditions: FDA performance criteria for powder/liquid acid-base cements.
  description: Solubility and disintegration in acid is the characteristic weakness of
    the class. The permitted eroded depth differs by family, glass polyalkenoate being
    the most resistant and zinc polycarboxylate the least.
  evidence:
  - reference: url:https://www.fda.gov/regulatory-information/search-fda-guidance-documents/dental-cements-performance-criteria-safety-and-performance-based-pathway
    reference_title: 'FDA guidance, Dental Cements - Performance Criteria for Safety and
      Performance Based Pathway (September 2024)'
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: '· Zinc phosphate: ≤0.30mm · Zinc polycarboxylate: ≤0.40mm · Glass polyalkenoate:
      ≤0.17mm'
    explanation: Acid erosion performance criteria, applicable to powder/liquid acid-base
      cements only.
  - reference: PMID:12628437
    reference_title: Erosion of water-based cements evaluated by volumetric and gravimetric
      methods.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Ranking of eroded depth and weight of residue was polycarboxylate>zinc phosphate>glass
      ionomers.
    explanation: The measured erosion ranking across the three families matches the order
      of the regulatory limits.
- name: Film thickness
  property_type: FILM_THICKNESS
  value: <=25
  unit: µm
  test_method: ISO 9917-1
  conditions: Luting cements only.
  description: The limit that lets a cast or ceramic restoration seat fully.
  evidence:
  - reference: url:https://www.fda.gov/regulatory-information/search-fda-guidance-documents/dental-cements-performance-criteria-safety-and-performance-based-pathway
    reference_title: 'FDA guidance, Dental Cements - Performance Criteria for Safety and
      Performance Based Pathway (September 2024)'
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: 'Performance Criteria: Maximum film thickness of 25 µm'
    explanation: Film thickness criterion, stated for luting cements.
- name: Fluoride release
  property_type: FLUORIDE_RELEASE
  description: Not a class-level property. Only the glass polyalkenoate members, whose
    powder is a fluoroaluminosilicate glass, release fluoride; the zinc-based members
    have no fluoride source.
  evidence:
  - reference: PMID:37615013
    reference_title: 'Fluoride exchange by glass-ionomer dental cements and its clinical
      effects: a review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Fluoride release has been shown to be a two-step process. In neutral solutions,
      the steps can be divided into early wash-out and long-term diffusion.
    explanation: >-
      Establishes the release kinetics for the glass polyalkenoate members only; the
      review is confined to glass-ionomer cements. Narrative review rather than a
      systematic review, so the source is recorded as OTHER. The abstract states that
      papers were selected from an initial PubMed search and that other relevant papers
      were cited where they added useful and relevant data, with no systematic protocol
      and no pooling.
clinical_uses:
- name: Luting of cast and ceramic restorations
  use_context: LUTING
  description: The principal use of the class. Retention is macromechanical, which is why
    it depends on a retentive preparation and an accurate fit rather than on adhesion.
  indications:
  - Cast metal inlays, onlays and partial crowns
  - Single-unit metal-ceramic crowns
  - Multiple-unit fixed dental prostheses with macroretentive preparation designs
  contraindications:
  - Non-retentive preparations, which need a polymerising adhesive cement
  evidence:
  - reference: PMID:17594382
    reference_title: 'To what extent does the longevity of fixed dental prostheses depend
      on the function of the cement? Working Group 4 materials: cementation.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Water-based cements exhibited satisfying long-term clinical performance associated
      with cast metal (inlays, onlays, partial crowns) as well as single unit metal-ceramic
      FDPs and multiple unit FDPs with macroretentive preparation designs and adequate
      marginal fit.
    explanation: >-
      Delimits the indications in which the class performs well, and ties that to
      macroretentive preparation and marginal fit. Consensus working-group narrative
      review rather than a systematic review, so the source is recorded as OTHER. The
      abstract describes a PubMed search plus a manual search of non-indexed literature,
      and states that recommendations had to be based on a lower evidence level in fields
      lacking randomized prospective studies.
- name: Base or liner under a restoration
  use_context: LINER_OR_BASE
  anatomical_site:
    preferred_term: dental pulp
    term:
      id: UBERON:0001754
      label: dental pulp
  description: Placed between the preparation and the definitive restoration to protect
    the pulp. ISO 9917-1 sets separate base/lining limits from the luting limits.
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3275
    reference_title: 21 CFR 872.3275 Dental cement
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: as a base cement to affix a temporary tooth filling, to affix dental devices
      such as crowns or bridges, or to be applied to a tooth to protect the tooth pulp
    explanation: The base and pulp-protection uses named in the identification paragraph.
- name: Restorative and temporary filling
  use_context: DIRECT_RESTORATION
  anatomical_site:
    preferred_term: tooth
    term:
      id: UBERON:0001091
      label: calcareous tooth
  description: Confined to low-stress sites. Among the class only the glass polyalkenoate
    members are used as definitive restoratives; the zinc-based members serve as temporary
    fillings.
  indications:
  - Temporary tooth filling
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3275
    reference_title: 21 CFR 872.3275 Dental cement
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: intended to serve as a temporary tooth filling or as a base cement to affix
      a temporary tooth filling
    explanation: The temporary filling use named in the identification paragraph.
clinical_performance:
- name: Retention of metal-based fixed partial dentures luted with zinc phosphate
  measure_type: RETENTION_RATE
  value: '100'
  unit: '%'
  follow_up_years: 3.16
  population: 49 patients with 49 metal-based fixed partial dentures, randomised between
    zinc phosphate and self-adhesive resin cement
  comparator: Self-adhesive resin cement
  description: No restoration in either arm was lost or needed recementation over the
    observation period.
  evidence:
  - reference: PMID:19100611
    reference_title: 'Self-adhesive resin cement versus zinc phosphate luting material:
      a prospective clinical trial begun 2003.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During that time no restoration was lost, no recementation became necessary.
    explanation: A member of the class matched a resin cement for retention over a mean
      3.16 years.
- name: Long-term clinical success of conventional luting
  measure_type: OTHER
  description: The long service record of the class in conventional luting of metal-based
    restorations, as summarised in the background of a prospective trial.
  evidence:
  - reference: PMID:19100611
    reference_title: 'Self-adhesive resin cement versus zinc phosphate luting material:
      a prospective clinical trial begun 2003.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The literature demonstrates that conventional luting of metal-based restorations
      using zinc phosphate cements is clinically successful over 20 years.
    explanation: Twenty-year clinical track record for the zinc phosphate member of the
      class.
adverse_effects:
- name: Pulpal irritation from the acidic liquid
  effect_category: PULPAL_RESPONSE
  description: The recurring class-level concern. The free acid of the freshly mixed cement
    can reach the pulp through dentinal tubules before the reaction has neutralised it.
    The effect differs sharply between acids, so it is not uniform across the class. No
    HP or MONDO term was bound; none matches this material-attributed pulpal response.
  evidence:
  - reference: PMID:2269210
    reference_title: '[Pulp toxicity of the acid components of acid-base reaction cements].'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The phosphoric acid of Tenet causes an almost complete collapse of the incisal
      microcirculation just a short time after its application.
    explanation: Direct measurement of the pulpal microcirculatory response to the acid
      component; rat model, laser-Doppler flowmetry.
  - reference: PMID:2269210
    reference_title: '[Pulp toxicity of the acid components of acid-base reaction cements].'
    supports: PARTIAL
    evidence_source: OTHER
    snippet: The tartrate of Ketac-Cem causes long-lasting hyperaemia, whereas the acryl-maleinate-copolymer
      has no discernible effects.
    explanation: The response is acid-specific, so pulpal irritation cannot be asserted
      uniformly across the class.
- name: Dissolution and disintegration at exposed margins
  effect_category: MECHANICAL_FAILURE
  description: Acid erosion of the exposed cement line, which can undermine a luted restoration.
    Ranking across the class follows the compositional family.
  evidence:
  - reference: PMID:11124414
    reference_title: A simple acid erosion test for dental water-based cements.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The depth loss for polycarboxylate was more than that for zinc phosphate,
      which was more than that for glass ionomer.
    explanation: Establishes the within-class erosion ranking.
  - reference: PMID:11124414
    reference_title: A simple acid erosion test for dental water-based cements.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The results appear to correlate with those obtained using a jet erosion test
      and with published data on clinical performance.
    explanation: Links the laboratory erosion ranking to reported clinical behaviour.
