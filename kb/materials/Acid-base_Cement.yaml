standards:
- identifier: ISO 9917-1:2025
  title: Dentistry - Water-based cements - Part 1 - Acid-base cements
  organization: ISO
  url: https://www.iso.org/standard/76037.html
- identifier: ISO 9917-2:2017
  title: Dentistry - Water-based cements - Part 2 - Resin-modified cements
  organization: ISO
  url: https://www.iso.org/standard/69901.html
notes: >-
  Class-level entry. Composition, properties and uses are stated for the class; subtype
  specifics belong in the child entries (Glass ionomer cement, Metal modified glass
  ionomer, Resin-modified glass ionomer, Zinc oxide cement, Zinc phosphate cement, Zinc
  polycarboxylate cement).

  Standards. ISO 9917-1 is the standard for the class. FDA recognises the third edition,
  2025-05, "Dentistry - Water-based cements - Part 1: Acid-base cements", under
  recognition number 4-348 (recognised 12/22/2025, extent Complete); the second edition,
  2007-10-01, was recognised as 4-153 under the older title "Powder/liquid acid-base
  cements". ISO 9917-2 (third edition 2017-09, FDA recognition 4-311) covers the
  resin-modified cements and marks the boundary of this class; the FDA guidance cited
  throughout draws its performance criteria from both parts. Editions and titles were
  verified against the FDA Recognized Consensus Standards database on 2026-09-05, not
  against the ISO catalogue, which blocks automated retrieval.

  Regulatory. Both branches of 21 CFR 872.3275 were re-verified against the CFR text and
  the FDA product classification database on 2026-09-05 and agree with docs/regulatory.md.
  Members of the class that are marketed as permanent tooth-coloured restoratives may
  instead be cleared under 872.3690 (tooth shade resin material, EBF/OFW); that route is
  recorded on the individual child entries rather than here, because the acid-base cement
  class as a whole is not a tooth shade resin material.

  Not filled. No products are listed: this is an abstract class, so branded products and
  their 510(k) records belong on the child entries. Working time is not recorded, because
  the FDA performance criterion for it applies to resin-modified cements under ISO 9917-2
  and so falls outside this class.

  Provenance. The deep research step of the curate-material skill could not be run: the
  claude_code provider was unauthenticated in this environment and no other provider key
  was set, so no research/Acid-base_Cement-deep-research-*.md report accompanies this
  entry. References were instead found by direct PubMed search, cached with
  just fetch-reference, and quoted from the cached abstracts.
