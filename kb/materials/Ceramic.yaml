regulatory_status:
- agency: FDA
  status: CLEARED
  regulation_number: '872.6660'
  regulation_title: Porcelain powder for clinical use
  device_class: CLASS_II
  product_codes: [EIH]
  pathways: [PREMARKET_NOTIFICATION_510K]
  special_controls: []
  identification: >-
    Porcelain powder for clinical use is a device consisting of a mixture of kaolin, felspar,
    quartz, or other substances intended for use in the production of artificial teeth in fixed
    or removable dentures, of jacket crowns, facings, and veneers. The device is used in
    prosthetic dentistry by heating the powder mixture to a high temperature in an oven to
    produce a hard prosthesis with a glass-like finish.
  approved_uses:
  - name: Production of artificial teeth in fixed or removable dentures, of jacket crowns, facings, and veneers
    use_context: INDIRECT_RESTORATION
  restrictions: []
  source_url: https://www.ecfr.gov/current/title-21/section-872.6660
  notes: >-
    This is the material-level device type for dental ceramics. Paragraph (b) assigns Class II
    and states no 510(k) exemption, so the pathway is premarket notification. The regulation's
    wording is pre-CAD/CAM, but EIH is empirically what modern ceramic blanks clear under: see
    products below for lithium disilicate and zirconia clearances carrying this code.
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.6660
    reference_title: 21 CFR 872.6660 Porcelain powder for clinical use
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: "(b) Classification. Class II."
    explanation: Classification paragraph, quoted in full; it contains no exemption sentence.
- agency: FDA
  status: CLEARED
  regulation_number: '872.3920'
  regulation_title: Porcelain tooth
  device_class: CLASS_II
  product_codes: [ELL]
  pathways: [PREMARKET_NOTIFICATION_510K]
  special_controls: []
  identification: >-
    A porcelain tooth is a prefabricated device made of porcelain powder for clinical use
    (872.6660) intended for use in construction of fixed or removable prostheses, such as
    crowns and partial dentures.
  approved_uses:
  - name: Construction of fixed or removable prostheses, such as crowns and partial dentures
    use_context: PROSTHODONTIC
  restrictions: []
  source_url: https://www.ecfr.gov/current/title-21/section-872.3920
  notes: >-
    Recorded because the regulation defines this device type as made of the material above, so
    it is the downstream device type for the same material rather than a different material.
    It is the prefabricated component, so it is a narrower device type than 872.6660 and not a
    substitute for it. The identification above replaces the section symbol before 872.6660
    with a bare number; the text is otherwise verbatim.
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3920
    reference_title: 21 CFR 872.3920 Porcelain tooth
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: "(b) Classification. Class II."
    explanation: Classification paragraph, quoted in full.
properties:
- name: Flexural strength, leucite-reinforced glass-ceramic
  property_type: FLEXURAL_STRENGTH
  value: 124.89-163.95
  unit: MPa
  test_method: Biaxial flexure
  conditions: Three commercial pressable leucite-based core ceramics, as-fired
  description: The low end of the class's strength range. After 9% hydrofluoric acid etching the
    same three materials fell to 98.37-143.74 MPa.
  evidence:
  - reference: PMID:25489158
    reference_title: "Evaluating the fracture toughness and flexural strength of pressable dental ceramics: an in vitro study."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Core material Performance Plus had the lowest biaxial strength of 124.89 MPa, Cergo had strength of 152.22 MPa and the highest value of 163.95 was reported for Esthetic Empress."
    explanation: Gives the three values the range is taken from.
  - reference: PMID:25489158
    reference_title: "Evaluating the fracture toughness and flexural strength of pressable dental ceramics: an in vitro study."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For samples treated 9 % HF, Performance Plus had the lowest biaxial strength of 98.37 MPa, Cergo had strength of 117.42 MPa and the highest value of 143.74 was reported for Esthetic Empress."
    explanation: Supports the etched values in the description.
- name: Flexural strength, translucent zirconia
  property_type: FLEXURAL_STRENGTH
  value: 803 +/- 233 (4Y-PSZ); 570 +/- 116 (5Y-PSZ)
  unit: MPa
  test_method: Pooled across laboratory studies; ISO 6872 adherence recommended by the authors
  conditions: 78 in vitro studies of commercially available translucent zirconia
  description: The upper part of the class's strength range, and the clearest illustration that
    strength inside the class is set by stabiliser content rather than by the class itself.
  evidence:
  - reference: PMID:40738693
    reference_title: Flexural strength of translucent zirconia for single crowns and fixed dental prostheses-A systematic review.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "The overall flexural strength values were significantly higher for 4Y-PSZ (803± 233 MPa) than for 5Y-PSZ materials (570 ± 116 MPa) (P = 0.005)."
    explanation: Source of both values.
  - reference: PMID:40738693
    reference_title: Flexural strength of translucent zirconia for single crowns and fixed dental prostheses-A systematic review.
    supports: PARTIAL
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "This systematic review highlights the challenges in comparing the flexural strength values of translucent zirconia owing to differences in processing parameters."
    explanation: The authors' own caution against reading these numbers as material constants.
- name: Fracture toughness across the class
  property_type: FRACTURE_TOUGHNESS
  value: <2 (micaceous glass-ceramic, feldspathic porcelain) to 4.9 (zirconia)
  unit: MPa m^1/2
  test_method: Single Edge Precracked Beam (SEPB) and Single Edge V-Notch Beam (SEVNB)
  description: The widest well-measured span of a mechanical property inside the class, and the
    reason the three families are not clinically interchangeable.
  evidence:
  - reference: PMID:12901984
    reference_title: Influence of microstructure and chemistry on the fracture toughness of dental ceramics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upper toughness limits for the micaceous glass-ceramics and feldspathic porcelains were significantly raised compared to the base glasses, but remained under 2 MPa m(1/2)."
    explanation: Establishes the lower bound of the span.
  - reference: PMID:12901984
    reference_title: Influence of microstructure and chemistry on the fracture toughness of dental ceramics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The third group KIc values were 2.8 MPa m(1/2) for a lithium disilicate glass-ceramic, 3.1 MPa m(1/2) for a glass-infused alumina, and 4.9 MPa m(1/2) for zirconia."
    explanation: Establishes the upper bound and the two intermediate steps.
  - reference: PMID:12901984
    reference_title: Influence of microstructure and chemistry on the fracture toughness of dental ceramics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the chemistry apparently defined a band of achievable property values."
    explanation: Why the span is a property of the family and not of processing.
- name: Fracture toughness, leucite-reinforced glass-ceramic
  property_type: FRACTURE_TOUGHNESS
  value: 1.063-1.225
  unit: MPa m^1/2
  conditions: Three commercial pressable leucite-based core ceramics
  description: Consistent with the sub-2 bound above. The source's abstract gives these values
    in "MPa"; the quantity is a stress intensity factor, so the unit recorded here is MPa m^1/2
    and the discrepancy is the source's, not a transcription error.
  evidence:
  - reference: PMID:25489158
    reference_title: "Evaluating the fracture toughness and flexural strength of pressable dental ceramics: an in vitro study."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Core material Performance Plus had the lowest fracture toughness of 1.063 MPa, Cergo had strength of 1.112 MPa and the highest value of 1.225 was reported for Esthetic Empress."
    explanation: Source of the range, and of the unit discrepancy noted in the description.
- name: Translucency relative to glass-ceramics
  property_type: TRANSLUCENCY
  description: The optical ceiling of polycrystalline ceramics. Higher-yttria zirconia has closed
    part of the gap to glass-ceramics but has not closed it, and buying translucency costs
    mechanical performance.
  evidence:
  - reference: PMID:33581910
    reference_title: "Flexural strength and translucency characterization of aesthetic monolithic zirconia and relevance to clinical indications: A systematic review."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Although significant improvement has occurred with recent monolithic zirconia types with higher yttria content having higher cubic/tetragonal ratio, they are still inferior to glass-ceramics' unique translucency."
    explanation: Places the two inorganic families against each other optically.
  - reference: PMID:33581910
    reference_title: "Flexural strength and translucency characterization of aesthetic monolithic zirconia and relevance to clinical indications: A systematic review."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "With improving zirconia aesthetically, some of mechanical performance was sacrificed."
    explanation: States the trade-off.
- name: Determinants of translucency
  property_type: TRANSLUCENCY
  description: What actually moves translucency within a subfamily, from a meta-analysis of 53
    in vitro studies.
  evidence:
  - reference: PMID:38443872
    reference_title: "Translucency of recent zirconia materials and material-related variables affecting their translucency: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Achieving optimum aesthetics with monolithic zirconia is challenging due to factors related to material aspects such as the presence of additives, point defects, microstructure, thickness, phase distribution, and sintering conditions."
    explanation: Enumerates the material-side determinants.
- name: Translucency stability under hydrothermal aging
  property_type: COLOR_STABILITY
  description: Aging changes translucency, but in most studies by less than the clinical
    acceptability threshold over the expected service life.
  evidence:
  - reference: PMID:32275345
    reference_title: "Translucency of Monolithic Zirconia after Hydrothermal Aging: A Review of In Vitro Studies."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "There is a controversy regarding how aging affects the translucency of monolithic zirconia ceramics; however, this may not be clinically important, as in most cases, changes (either decrease or increase) in translucency were within the acceptability thresholds."
    explanation: The finding, with the authors' own hedge retained.
  - reference: PMID:32275345
    reference_title: "Translucency of Monolithic Zirconia after Hydrothermal Aging: A Review of In Vitro Studies."
    supports: PARTIAL
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "For longer aging times, beyond the perspective clinical life of the restorations, the change in translucency is higher than the acceptability threshold."
    explanation: Bounds the conclusion in time.
- name: Chemical solubility
  property_type: SOLUBILITY
  test_method: ISO 6872:2015 chemical solubility
  description: Recorded as a caution about the standard rather than as a value. The ISO 6872:2015
    method fixes only total specimen surface area, not geometry, and the result moves with
    geometry, so solubility figures from different laboratories are not comparable.
  evidence:
  - reference: PMID:31759562
    reference_title: "Evaluation of reproducibility of the chemical solubility of dental ceramics using ISO 6872:2015."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results of the original chemical solubility method of ISO 6872:2015 showed significantly variable findings for each tested material, with a predictable relationship between geometry and chemical solubility."
    explanation: Establishes the geometry dependence.
  - reference: PMID:31759562
    reference_title: "Evaluation of reproducibility of the chemical solubility of dental ceramics using ISO 6872:2015."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results of the current chemical solubility standard method can be manipulated while still complying with the ISO 6872:2015 standard."
    explanation: The authors' conclusion, which is why no single value is recorded here.
- name: Coefficient of thermal expansion
  property_type: THERMAL_EXPANSION
  value: 10.80 (zirconia); 7.83-12.95 (veneering ceramics)
  unit: 10^-6 /degC
  description: Matters as a difference rather than as a level, because bilayered ceramic restorations fail at the
    interface when the veneering ceramic and the substructure expand differently.
  evidence:
  - reference: PMID:29721230
    reference_title: Role of coefficient of thermal expansion on bond strength of ceramic veneered yttrium-stabilized zirconia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The CTE (×10-6/°C) were 10.80, 7.83, 7.87, 9.86, 9.93, 10.03, and 12.95 for Z, VDα, VM7, IeC, VM9, CCK, and IdS."
    explanation: Source of both figures; Z is the zirconia substructure, the rest are veneering ceramics.
  - reference: PMID:29721230
    reference_title: Role of coefficient of thermal expansion on bond strength of ceramic veneered yttrium-stabilized zirconia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CTE's compatibility of veneering ceramic to zirconia is crucial for enhancing the bond strength."
    explanation: Why the difference rather than the value is the property of interest.
- name: Biocompatibility and biofilm formation
  property_type: BIOCOMPATIBILITY
  description: In vitro only. Glazing raised surface roughness and worsened both fibroblast
    viability and Streptococcus mutans adhesion relative to unglazed zirconia, which makes
    surface finish rather than bulk composition the biological variable.
  evidence:
  - reference: PMID:40551320
    reference_title: "Surface Properties, Biocompatibility, and Bacterial Adherence of Four Zirconia Variants for Aesthetic Zone Abutments."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The GL-zirconia group demonstrated lower HGFs viability and higher S. mutans adhesion compared to the other three groups."
    explanation: The finding. GL is the glazed group.
clinical_performance:
- name: Five-year survival of tooth-supported single crowns, by ceramic family
  measure_type: SURVIVAL_RATE
  value: 90.4-98.5
  unit: '%'
  follow_up_years: 5
  population: 8051 all-ceramic and 3509 metal-ceramic tooth-supported single crowns, 64 studies
  comparator: Metal-ceramic single crowns (97.1% at 5 years in the same analysis)
  description: The most useful single piece of evidence for this entry, because it reports by
    family and so shows the spread within the class. Monolithic lithium disilicate is at the top
    and feldspathic/silica-based ceramic at the bottom.
  evidence:
  - reference: PMID:41489982
    reference_title: A Systematic Review and Meta-analysis Evaluating the Survival, Failure, and Complication Rates of Metal-Ceramic, Veneered, and Monolithic All-Ceramic Tooth-Supported Single Crowns-Part 1.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Five-year survival rates were: 98.5% for monolithic lithium-disilicate reinforced glass-ceramic, 97.3% for veneered densely-sintered zirconia, 97.1% for metal-ceramic, 96.8% for monolithic densely-sintered zirconia, 95.7% for veneered leucite/lithium-disilicate reinforced glass-ceramic, 94.5% for densely-sintered alumina, 94.3% for glass-infiltrated alumina, 90.4% for feldspathic/silica-based ceramic."
    explanation: Source of the range and of every family-level figure.
  - reference: PMID:41489982
    reference_title: A Systematic Review and Meta-analysis Evaluating the Survival, Failure, and Complication Rates of Metal-Ceramic, Veneered, and Monolithic All-Ceramic Tooth-Supported Single Crowns-Part 1.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Monolithic lithium-disilicate and monolithic zirconia crowns showed significantly fewer ceramic fractures and chipping compared to veneered alternatives."
    explanation: Identifies design, not only material, as a determinant of survival.
- name: Five-year survival of single crowns, earlier evidence round
  measure_type: SURVIVAL_RATE
  value: 92.1-96.6
  unit: '%'
  follow_up_years: 5
  population: 9434 all-ceramic and 4663 metal-ceramic single crowns, 67 studies (search to 2013)
  comparator: Metal-ceramic single crowns, 94.7%
  description: Retained deliberately alongside the 2026 review to record that the verdict on
    zirconia has moved. This round advised against zirconia as a primary option on the strength
    of technical complications; the later round, with monolithic designs in the pool, does not.
  evidence:
  - reference: PMID:25842099
    reference_title: "All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part I: Single crowns (SCs)."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Survival rates of most types of all-ceramic SCs were similar to those reported for metal-ceramic SCs, both in anterior and posterior regions."
    explanation: The headline conclusion at class level.
  - reference: PMID:25842099
    reference_title: "All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part I: Single crowns (SCs)."
    supports: PARTIAL
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Weaker feldspathic/silica-based ceramics should be limited to applications in the anterior region."
    explanation: The site restriction that follows from the strength spread inside the class.
  - reference: PMID:25842099
    reference_title: "All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part I: Single crowns (SCs)."
    supports: PARTIAL
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Zirconia-based SCs should not be considered as primary option due to their high incidence of technical problems."
    explanation: The superseded recommendation, recorded so the change over time is visible.
- name: Five-year survival of implant-supported single crowns
  measure_type: SURVIVAL_RATE
  value: '97.6'
  unit: '%'
  follow_up_years: 5
  population: 912 zirconia implant-supported single crowns, 35 studies
  comparator: Metal-ceramic implant-supported single crowns, 98.3%
  evidence:
  - reference: PMID:30328190
    reference_title: A systematic review of the survival and complication rates of zirconia-ceramic and metal-ceramic single crowns.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Meta-analysis revealed an estimated 5-year survival rate of 98.3% (95% CI: 96.8-99.1) for metal-ceramic implant supported SCs (n = 4,363) compared to 97.6% (95% CI: 94.3-99.0) for zirconia implant supported SCs (n = 912)."
    explanation: Source of both figures.
  - reference: PMID:30328190
    reference_title: A systematic review of the survival and complication rates of zirconia-ceramic and metal-ceramic single crowns.
    supports: PARTIAL
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Significantly (p = 0.001), more zirconia-ceramic implant SCs failed due to material fractures (2.1% vs. 0.2% metal-ceramic implant SCs)."
    explanation: The failure mode that the survival figure alone hides.
- name: Survival of inlays, onlays and overlays
  measure_type: SURVIVAL_RATE
  value: 92-95 at 5 years; 91 at 10 years
  unit: '%'
  follow_up_years: 10
  population: 5811 restorations at 5 years and 2154 at 10 years, 14 studies
  description: Glass-ceramics and feldspathic porcelain together; the meta-regression found the
    ceramic type did not affect the survival rate in this indication.
  evidence:
  - reference: PMID:27287305
    reference_title: "Survival Rate of Resin and Ceramic Inlays, Onlays, and Overlays: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Estimated survival rates for glass-ceramics and feldspathic porcelain were between 92% and 95% at 5 y (n = 5,811 restorations) and were 91% at 10 y (n = 2,154 restorations)."
    explanation: Source of both figures.
  - reference: PMID:27287305
    reference_title: "Survival Rate of Resin and Ceramic Inlays, Onlays, and Overlays: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "The meta-regression indicated that the type of ceramic material (feldspathic porcelain vs. glass-ceramic), study design (retrospective vs. prospective), follow-up time (5 vs. 10 y), and study setting (university vs. private clinic) did not affect the survival rate."
    explanation: Supports pooling the two subfamilies in this indication.
- name: Long-term survival of ceramic laminate veneers
  measure_type: SURVIVAL_RATE
  value: 93.70-96.81
  unit: '%'
  follow_up_years: 10.4
  population: 29 studies of anterior and premolar ceramic laminate veneers
  description: Feldspathic 96.13%, leucite-reinforced 93.70%, lithium disilicate 96.81%, with no
    significant difference in survival between materials. Complication rates did differ sharply.
  evidence:
  - reference: PMID:39523553
    reference_title: "Survival and Complication Rates of Feldspathic, Leucite-Reinforced, Lithium Disilicate and Zirconia Ceramic Laminate Veneers: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Meta-analysis revealed a pooled survival-rate of 96.13% for feldspathic, 93.70% for LRGC and 96.81% for LDS at 10.4 years. No difference was found between materials."
    explanation: Source of all three figures and of the no-difference finding.
  - reference: PMID:39523553
    reference_title: "Survival and Complication Rates of Feldspathic, Leucite-Reinforced, Lithium Disilicate and Zirconia Ceramic Laminate Veneers: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Zirconia showed a 100% survival-rate with no complications at 2.6 years. No long-term data was available for zirconia."
    explanation: Records the gap rather than letting the 100% figure stand unqualified.
- name: Survival of ceramic partial coverage restorations
  measure_type: SURVIVAL_RATE
  value: 93.7 (lithium disilicate); 89.3 (resin-matrix ceramic)
  unit: '%'
  population: 35 publications reviewed for a consensus conference
  description: Short-term only, and the one place in this entry where the resin-matrix family has
    its own class-level clinical figure.
  evidence:
  - reference: PMID:40245384
    reference_title: "Survival and Complication Rates of Ceramic Partial Coverage Restorations (PCRs) and Ceramic Laminate Veneers Made of Different Types of Ceramics. Consensus Statement From SSRD, SEPES, and PROSEC Conference on Minimally Invasive Restorations."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "PCRs demonstrated high short-term survival rates, with 93.7% for LDS and 89.3% for RMC."
    explanation: Source of both figures, with the short-term qualifier in the same sentence.
- name: Ten-year survival of zirconia-framework fixed dental prostheses
  measure_type: SURVIVAL_RATE
  value: '95.0'
  unit: '%'
  follow_up_years: 10
  population: 20 mainly posterior 3- to 6-unit FDPs in 15 patients, prospective
  description: Paired with a 78.8% chipping-free rate at the same 10 years, which is the more
    informative number, because the frameworks survive where the veneers do not.
  evidence:
  - reference: PMID:29520468
    reference_title: Ten-year survival and chipping rates and clinical quality grading of zirconia-based fixed dental prostheses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 10-year survival rate and 10-year chipping-free rate were 95.0% (CI 86.0-100%) and 78.8% (CI 62.2-99.7%), respectively."
    explanation: Source of both rates.
- name: Three-year survival of posterior monolithic zirconia crowns
  measure_type: SURVIVAL_RATE
  value: '89.8'
  unit: '%'
  follow_up_years: 3
  population: 177 posterior single monolithic zirconia crowns, retrospective
  description: Lower than the pooled 96.8% five-year figure for monolithic zirconia above, in a
    single retrospective posterior cohort. Non-vital abutments were the risk factor.
  evidence:
  - reference: PMID:36104182
    reference_title: The 3-year cumulative survival rates of posterior monolithic zirconia crowns and their antagonist teeth, and their influencing factors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3-year cumulative survival rate of single MZCs was 89.8% (9 of 177 MZCs, 95% confidence interval (CI): 80.0-95.1%)."
    explanation: Source of the figure.
  - reference: PMID:36104182
    reference_title: The 3-year cumulative survival rates of posterior monolithic zirconia crowns and their antagonist teeth, and their influencing factors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although posterior single MZCs were clinically acceptable, non-vital pulpal condition could be a potential risk factor for failures in the abutment and antagonist teeth of MZCs."
    explanation: The risk factor named in the description.
adverse_effects:
- name: Ceramic fracture and chipping
  effect_category: MECHANICAL_FAILURE
  description: The dominant failure mode of the class in every indication. Bilayered designs fail
    by veneer chipping, monolithic designs less so.
  evidence:
  - reference: PMID:27287305
    reference_title: "Survival Rate of Resin and Ceramic Inlays, Onlays, and Overlays: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Failures were related to fractures/chipping (4%), followed by endodontic complications (3%), secondary caries (1%), debonding (1%), and severe marginal staining (0%)."
    explanation: Ranks fracture first among failure causes, with the other modes for context.
  - reference: PMID:41489982
    reference_title: A Systematic Review and Meta-analysis Evaluating the Survival, Failure, and Complication Rates of Metal-Ceramic, Veneered, and Monolithic All-Ceramic Tooth-Supported Single Crowns-Part 1.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Monolithic designs reduce fracture and chipping risk, improving long-term clinical outcomes."
    explanation: Identifies the design factor that modifies the risk.
  - reference: PMID:25842099
    reference_title: "All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part I: Single crowns (SCs)."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "In total higher 5 year rates of framework fracture were reported for the all-ceramic SCs than for metal-ceramic SCs."
    explanation: Frames the risk against the metal-ceramic comparator.
- name: Chipping of veneered zirconia frameworks
  effect_category: MECHANICAL_FAILURE
  frequency: 21.2% of zirconia-framework FDPs chipped within 10 years
  description: Recorded separately from fracture because the framework survives it; the
    restoration is damaged rather than lost, which is why survival and chipping rates diverge.
  evidence:
  - reference: PMID:29520468
    reference_title: Ten-year survival and chipping rates and clinical quality grading of zirconia-based fixed dental prostheses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 10-year survival rate and 10-year chipping-free rate were 95.0% (CI 86.0-100%) and 78.8% (CI 62.2-99.7%), respectively."
    explanation: The 78.8% chipping-free rate is the complement of the frequency recorded here.
  - reference: PMID:29520468
    reference_title: Ten-year survival and chipping rates and clinical quality grading of zirconia-based fixed dental prostheses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, because damage to the surface texture showed a disproportionate increase after long-term usage, additional long-term studies are required."
    explanation: The authors' own caution about how this accumulates with time.
- name: Loss of retention
  effect_category: MECHANICAL_FAILURE
  description: A cementation-interface rather than a bulk-material failure, reported at higher
    rates for zirconia crowns than for metal-ceramic.
  evidence:
  - reference: PMID:25842099
    reference_title: "All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part I: Single crowns (SCs)."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Densely sintered zirconia SCs were more frequently lost due to veneering ceramic fractures than metal-ceramic SCs (p<0.001), and had significantly more loss of retention (p<0.001)."
    explanation: Source for both this effect and the veneer-fracture effect above.
- name: Antagonist enamel wear
  effect_category: ANTAGONIST_WEAR
  description: Real, but not specific to ceramic. The network meta-analysis found enamel wears
    against natural enamel too, and metal-ceramic antagonists produced the most wear of the
    restorative materials compared. No condition term is bound because neither HP nor MONDO has
    a fitting tooth-wear phenotype.
  evidence:
  - reference: PMID:38925985
    reference_title: "Dental human enamel wear caused by ceramic antagonists: A systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "The wear is larger on surfaces with the ceramic crown antagonists studied (metal-ceramic, glazed zirconia, and polished zirconia)."
    explanation: Establishes the effect and names the materials compared.
  - reference: PMID:38925985
    reference_title: "Dental human enamel wear caused by ceramic antagonists: A systematic review and network meta-analysis."
    supports: PARTIAL
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Enamel wear occurs in all teeth, even when the antagonist is a natural tooth."
    explanation: The baseline that keeps this from being read as ceramic-specific.
  - reference: PMID:38925985
    reference_title: "Dental human enamel wear caused by ceramic antagonists: A systematic review and network meta-analysis."
    supports: PARTIAL
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "Network meta-analysis showed higher enamel wear was observed in natural dental enamel against metal-ceramic antagonists."
    explanation: Identifies which antagonist was worst; the certainty of this evidence was rated moderate.
- name: Low-temperature degradation of zirconia
  effect_category: OTHER
  description: An ageing mechanism of the polycrystalline family only, not of the class. Moisture
    at mouth temperature drives the tetragonal-to-monoclinic transformation, roughening the
    surface and lowering fatigue strength; resistance rises with yttria content.
  evidence:
  - reference: PMID:38281620
    reference_title: Effect of low-temperature degradation on the fatigue performance of dental strength-gradient multilayered zirconia restorations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "After LTD, the phase transformation, surface roughness, depth of transformed zone, and residual stress were increased and inversely associated with the yttria content."
    explanation: The mechanism and its dependence on composition.
  - reference: PMID:38281620
    reference_title: Effect of low-temperature degradation on the fatigue performance of dental strength-gradient multilayered zirconia restorations.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "These results show that although LTD reduces the absolute fatigue strength of strength-gradient multilayered zirconia restorations, it also reduces the effect of cyclic fatigue itself on the strength of zirconia (relative to monotonic strength), which might be due to the increase of residual stress."
    explanation: The effect is not uniformly deleterious, which the description should not overstate.
- name: Periodontal response at abutment teeth
  effect_category: PERIODONTAL_RESPONSE
  description: Clinically acceptable but measurably worse than contralateral control teeth after
    ten years, in the one long-term prospective cohort in this entry.
  evidence:
  - reference: PMID:29520468
    reference_title: Ten-year survival and chipping rates and clinical quality grading of zirconia-based fixed dental prostheses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The periodontal health of tissues adjacent to the study teeth was clinically acceptable, but inferior to the ones of control teeth."
    explanation: States both halves of the finding.
