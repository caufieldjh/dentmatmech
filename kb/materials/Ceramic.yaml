notes: >-
  Scope. OHD:0000135 is a class with 20 descendants, so every claim here is pitched at the level
  of ceramic as a restorative device type. Where the only measured values are subtype-specific
  they are recorded as bounds on the class with the subtype named in the property name or value,
  and the family-specific numbers are left to the children.


  Regulatory. The material-level FDA device type is 872.6660 "Porcelain powder for clinical use"
  (product code EIH, Class II, 510(k)), and 872.3920 "Porcelain tooth" (ELL) is the downstream
  prefabricated-component device type that the regulation itself defines as being made of the
  872.6660 material. Both regulation texts, both classes and both product codes were read from
  the eCFR renderer API and the FDA product classification database on 2026-09-27; 872.6660 has
  exactly one product code. The regulation's wording predates CAD/CAM and names only kaolin,
  felspar and quartz, but EIH is empirically the code modern ceramic blanks carry, which is why
  the three verified products below are all EIH. Two neighbouring device types are deliberately
  not recorded as this material's own status: 872.3630 endosseous dental implant abutment (NHA),
  where ceramic abutments clear but whose identification names no material, and 872.3661 (NOF),
  which is the CAD/CAM system rather than the ceramic.


  Known inconsistency with a child entry. kb/materials/Zirconia_Polycrystalline_Ceramic.yaml
  records status UNKNOWN with a note saying zirconia CAD/CAM blanks are "typically cleared by
  510(k) under 872.3690 (tooth shade resin material, product code EBF)". That is contradicted by
  this run's verification, and that note already says the records "have not yet been verified".
  Correcting the child was out of scope for a one-material run and is flagged for a later one.


  Standards. All six were read from their own FDA recognition detail pages rather than from the
  per-product-code query, so no row implies that the set is complete; the EIH recognition list
  is longer and includes furnace, investment and die-material standards that are not properties
  of the ceramic. One transition is worth knowing: the 45644 page states that recognition of ISO
  6872 Fourth edition 2015-06-01 [Rec# 4-251] "will be superseded by recognition of ISO 6872
  Fifth edition 2024-08 [Rec# 4-329]", with declarations of conformity to 4-251 accepted until
  December 20, 2026. The edition recorded here is therefore the Fifth.


  Products. Only K211916 filed a 510(k) Summary; K051705 and K131534 filed a Statement, so the
  database carries no indications-for-use text for them and none is recorded.


  Gaps. No EU MDR, Health Canada, TGA or other non-FDA status is recorded, because none was
  verified. No hypersensitivity or allergy adverse effect is recorded: no source in this entry's
  reference set documents one for ceramic, and the absence of evidence is not evidence of
  absence. Hardness, elastic modulus, radiopacity and wear resistance are not populated, since
  no cached source gave class-level values for them. No mapping to MeSH is recorded even though
  MeSH has "Dental Porcelain", because MeSH is not in conf/oak_config.yaml; NCIT has no
  dental-ceramic material concept, so the only mapping is the broad NCIT:C42634 Dental Material.


  Research provenance. The deep-research shim could not run in this environment (no provider
  credentials reach the subprocess), and PubMed esearch was returning HTTP 500 throughout the
  run, so discovery used the Europe PMC REST API and every cited abstract was then cached
  through just fetch-reference. See research/Ceramic-deep-research-claude_code.md for the full
  account. Curation status is IN_PROGRESS rather than CURATED: no full texts were read beyond
  the cached records, and no non-US regulator was verified.
