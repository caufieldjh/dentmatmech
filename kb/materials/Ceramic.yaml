name: Ceramic
creation_date: '2026-09-04T20:17:41Z'
curation_status: IN_PROGRESS
description: A dental restoration material that has a nonmetallic inorganic structure consisting
  primarily of compounds containing oxygen combined with one or more metallic or semi-metallic
  elements that are processed at high temperatures, pressed, and polished or milled.
material_term:
  preferred_term: Ceramic
  term:
    id: OHD:0000135
    label: ceramic dental restoration material
category: CERAMIC
parents:
- Dental restoration material
synonyms:
- dental ceramic
- all-ceramic material
- ceramic restorative material
- dental porcelain
mappings:
- id: NCIT:C42634
  label: Dental Material
  predicate: BROAD_MATCH
  source: NCI Thesaurus via OLS
setting_mechanisms:
- SINTERING
- HEAT_PRESSING
- MILLING
composition:
- name: Glass-matrix phase
  role: MATRIX
  description: An amorphous silicate glass phase. Its presence or absence is the criterion that
    separates the two inorganic families of the class, and so separates this entry's children
    Glass matrix ceramic and Polycrystalline ceramic.
  evidence:
  - reference: PMID:25965634
    reference_title: A new classification system for all-ceramic and ceramic-like restorative materials.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "an all-ceramic material is classified according to whether a glass-matrix phase is present (glass-matrix ceramics) or absent (polycrystalline ceramics) or whether the material contains an organic matrix highly filled with ceramic particles (resin-matrix ceramics)"
    explanation: States the compositional criterion that defines the three families of the class.
- name: Feldspar
  role: MATRIX
  chemical:
    preferred_term: feldspar
    term:
      id: CHEBI:48733
      label: feldspar
  description: The traditional glass former of dental porcelain, named in the FDA identification
    of the device type (spelled "felspar" there).
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.6660
    reference_title: 21 CFR 872.6660 Porcelain powder for clinical use
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: "Porcelain powder for clinical use is a device consisting of a mixture of kaolin, felspar, quartz, or other substances intended for use in the production of artificial teeth in fixed or removable dentures, of jacket crowns, facings, and veneers."
    explanation: The regulation names the constituents of the device type by name.
- name: Quartz
  role: FILLER
  chemical:
    preferred_term: quartz
    term:
      id: CHEBI:46727
      label: quartz
  description: Crystalline silica, one of the three constituents named in the FDA identification.
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.6660
    reference_title: 21 CFR 872.6660 Porcelain powder for clinical use
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: "Porcelain powder for clinical use is a device consisting of a mixture of kaolin, felspar, quartz, or other substances intended for use in the production of artificial teeth in fixed or removable dentures, of jacket crowns, facings, and veneers."
    explanation: The regulation names the constituents of the device type by name.
- name: Kaolin
  role: OTHER
  chemical:
    preferred_term: kaolin
    term:
      id: CHEBI:140503
      label: kaolin
  description: Clay component of traditional dental porcelain, named in the FDA identification.
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.6660
    reference_title: 21 CFR 872.6660 Porcelain powder for clinical use
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: "Porcelain powder for clinical use is a device consisting of a mixture of kaolin, felspar, quartz, or other substances intended for use in the production of artificial teeth in fixed or removable dentures, of jacket crowns, facings, and veneers."
    explanation: The regulation names the constituents of the device type by name.
- name: Leucite
  role: CRYSTALLINE_PHASE
  description: Reinforcing crystalline phase of leucite-reinforced glass-ceramics. No ChEBI term
    exists for leucite, so no chemical term is bound.
  evidence:
  - reference: PMID:41990584
    reference_title: A state-of-the-art review on chairside CAD/CAM ceramic materials in restorative dentistry.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main classifications of chairside CAD/CAM materials include feldspathic ceramics, leucite-reinforced ceramics, lithium disilicate ceramics, zirconia-reinforced lithium silicates, resin nanoceramics, polymer-infiltrated ceramic-network and zirconia."
    explanation: Names leucite reinforcement as one of the subfamilies of the class.
- name: Lithium disilicate
  role: CRYSTALLINE_PHASE
  description: Reinforcing crystalline phase of the strongest glass-matrix subfamily. No ChEBI
    term exists, so no chemical term is bound.
  evidence:
  - reference: PMID:12901984
    reference_title: Influence of microstructure and chemistry on the fracture toughness of dental ceramics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The third group KIc values were 2.8 MPa m(1/2) for a lithium disilicate glass-ceramic, 3.1 MPa m(1/2) for a glass-infused alumina, and 4.9 MPa m(1/2) for zirconia."
    explanation: Names lithium disilicate as a crystalline phase of the class and places its toughness.
- name: Aluminium oxide
  role: CRYSTALLINE_PHASE
  chemical:
    preferred_term: alumina
    term:
      id: CHEBI:30187
      label: aluminium oxide
  description: Crystalline phase of glass-infiltrated and densely sintered alumina ceramics, the
    first high-strength all-ceramic core materials.
  evidence:
  - reference: PMID:12901984
    reference_title: Influence of microstructure and chemistry on the fracture toughness of dental ceramics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The third group KIc values were 2.8 MPa m(1/2) for a lithium disilicate glass-ceramic, 3.1 MPa m(1/2) for a glass-infused alumina, and 4.9 MPa m(1/2) for zirconia."
    explanation: Names glass-infused alumina as a member of the class and places its toughness.
- name: Zirconium dioxide
  role: CRYSTALLINE_PHASE
  chemical:
    preferred_term: zirconia
    term:
      id: CHEBI:747200
      label: zirconium dioxide
  description: The polycrystalline phase of the toughest subfamily of the class.
  evidence:
  - reference: PMID:12901984
    reference_title: Influence of microstructure and chemistry on the fracture toughness of dental ceramics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The third group KIc values were 2.8 MPa m(1/2) for a lithium disilicate glass-ceramic, 3.1 MPa m(1/2) for a glass-infused alumina, and 4.9 MPa m(1/2) for zirconia."
    explanation: Places zirconia at the top of the class's toughness range.
- name: Yttrium oxide
  role: STABILIZER
  description: Stabilises the zirconia polymorph and indexes the zirconia grades (3Y, 4Y, 5Y).
    Raising it buys translucency and costs strength. No ChEBI term exists for yttrium oxide.
  evidence:
  - reference: PMID:40738693
    reference_title: Flexural strength of translucent zirconia for single crowns and fixed dental prostheses-A systematic review.
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "The overall flexural strength values were significantly higher for 4Y-PSZ (803± 233 MPa) than for 5Y-PSZ materials (570 ± 116 MPa) (P = 0.005)."
    explanation: Shows yttria content indexing the grades and setting their strength.
  - reference: PMID:38443872
    reference_title: "Translucency of recent zirconia materials and material-related variables affecting their translucency: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: "They reported that changing yttria content had a significant impact on translucency."
    explanation: The other half of the yttria trade-off.
- name: Organic resin matrix
  role: MATRIX
  description: Present only in the resin-matrix family, which is why that family is a child of
    this entry rather than of the resin composite branch.
  evidence:
  - reference: PMID:25965634
    reference_title: A new classification system for all-ceramic and ceramic-like restorative materials.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "an all-ceramic material is classified according to whether a glass-matrix phase is present (glass-matrix ceramics) or absent (polycrystalline ceramics) or whether the material contains an organic matrix highly filled with ceramic particles (resin-matrix ceramics)"
    explanation: Defines the resin-matrix family by the presence of an organic matrix.
