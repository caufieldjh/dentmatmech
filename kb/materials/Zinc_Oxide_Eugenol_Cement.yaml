name: Zinc oxide eugenol cement
creation_date: '2026-09-04T20:17:41Z'
curation_status: IN_PROGRESS
description: A zinc-oxide cement dental restoration material containing eugenol as a liquid
  component to complete the acid-base reaction.
material_term:
  preferred_term: Zinc oxide eugenol cement
  term:
    id: OHD:0001007
    label: zinc oxide eugenol cement dental restoration material
category: CEMENT
parents:
- Zinc oxide cement
synonyms:
- ZOE
- zinc oxide-eugenol
setting_mechanisms:
- ACID_BASE_REACTION
composition:
- name: Zinc oxide
  role: POWDER
  chemical:
    preferred_term: zinc oxide
    term:
      id: CHEBI:36560
      label: zinc oxide
- name: Eugenol
  role: LIQUID
  chemical:
    preferred_term: eugenol
    term:
      id: CHEBI:4917
      label: eugenol
  description: The acidic phenol that chelates zinc to form the set matrix; also the source of the material's sedative effect on the pulp and its incompatibility with resin polymerization.
properties:
- name: Compressive strength, modified temporary cement
  property_type: COMPRESSIVE_STRENGTH
  value: below 35
  unit: MPa
  conditions: 24 h; twelve modifications of a temporary ZOE cement
  evidence:
  - reference: PMID:10666964
    reference_title: Retentive and compressive strengths of modified zinc oxide-eugenol cements.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All modified forms of the cement had a film thickness less than 25 microns and a compressive strength below 35 MPa.
    explanation: Bench values for a temporary ZOE cement; low strength is expected for this use.
- name: Film thickness, modified temporary cement
  property_type: FILM_THICKNESS
  value: less than 25
  unit: µm
  evidence:
  - reference: PMID:10666964
    reference_title: Retentive and compressive strengths of modified zinc oxide-eugenol cements.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All modified forms of the cement had a film thickness less than 25 microns and a compressive strength below 35 MPa.
    explanation: Same source as above.
clinical_uses:
- name: Temporary filling
  use_context: TEMPORARY
- name: Temporary luting of provisional restorations
  use_context: LUTING
- name: Base under restorations, pulp protection
  use_context: LINER_OR_BASE
  anatomical_site:
    preferred_term: dental pulp
    term:
      id: UBERON:0001754
      label: dental pulp
  contraindications:
  - Under or adjacent to resin-based materials, because eugenol inhibits free-radical polymerization
regulatory_status:
- agency: FDA
  status: EXEMPT
  regulation_number: '872.3275'
  regulation_title: Dental cement (zinc oxide-eugenol)
  device_class: CLASS_I
  product_codes:
  - EMB
  pathways:
  - EXEMPT_510K
  identification: Zinc oxide-eugenol is a device composed of zinc oxide-eugenol intended to serve as a temporary tooth filling or as a base cement to affix a temporary tooth filling, to affix dental devices such as crowns or bridges, or to be applied to a tooth to protect the tooth pulp.
  approved_uses:
  - name: Temporary tooth filling
    use_context: TEMPORARY
  - name: Base cement to affix a temporary tooth filling
    use_context: LINER_OR_BASE
  - name: Affixing dental devices such as crowns or bridges
    use_context: LUTING
  - name: Application to a tooth to protect the pulp
    use_context: LINER_OR_BASE
  source_url: https://www.ecfr.gov/current/title-21/section-872.3275
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3275
    reference_title: 21 CFR 872.3275 Dental cement
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: The device is exempt from the premarket notification procedures in subpart E of part 807 of this chapter subject to § 872.9.
    explanation: The zinc oxide-eugenol branch is class I and 510(k)-exempt.
  - reference: url:https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpcd/classification.cfm?start_search=1&regulationnumber=872.3275
    reference_title: FDA Product Classification Database, regulation 872.3275
    supports: SUPPORT
