name: Predominantly base metal
creation_date: '2026-09-04T20:17:41Z'
curation_status: IN_PROGRESS
description: A metal dental restoration material that is composed of group of cast metals
  that rely on Chromium for corrosion resistance.
material_term:
  preferred_term: Predominantly base metal
  term:
    id: OHD:0000156
    label: predominantly base metal dental restoration material
category: METAL
parents:
- Metal
synonyms:
- base metal alloy
- non-precious alloy
setting_mechanisms:
- CASTING
- MILLING
- ADDITIVE_MANUFACTURING
composition:
- name: Chromium
  role: ALLOYING_ELEMENT
  chemical:
    preferred_term: chromium
    term:
      id: CHEBI:28073
      label: chromium atom
  description: Provides corrosion resistance through a passive oxide layer.
- name: Nickel
  role: ALLOYING_ELEMENT
  chemical:
    preferred_term: nickel
    term:
      id: CHEBI:28112
      label: nickel atom
  description: Base of nickel-chromium alloys; the main sensitizer in the class.
- name: Cobalt
  role: ALLOYING_ELEMENT
  chemical:
    preferred_term: cobalt
    term:
      id: CHEBI:27638
      label: cobalt atom
  description: Base of cobalt-chromium alloys.
clinical_uses:
- name: Cast crown and bridge restorations
  use_context: INDIRECT_RESTORATION
  procedure:
    preferred_term: predominantly base metal crown
    term:
      id: OHD:0000162
      label: predominantly base metal crown restoration procedure
- name: Porcelain-fused-to-metal frameworks
  use_context: INDIRECT_RESTORATION
  procedure:
    preferred_term: porcelain fused to predominantly base metal crown
    term:
      id: OHD:0000161
      label: porcelain fused to predominantly base metal crown restoration procedure
- name: Removable partial denture frameworks
  use_context: PROSTHODONTIC
adverse_effects:
- name: Nickel and cobalt hypersensitivity
  effect_category: ALLERGIC_OR_HYPERSENSITIVITY
  effect_term:
    preferred_term: allergic contact reaction
    term:
      id: MONDO:0006525
      label: allergic contact dermatitis
  description: Nickel and cobalt have relatively high potential to cause allergy; the true risk from alloys containing them remains undefined.
  evidence:
  - reference: PMID:10668036
    reference_title: 'Biocompatibility of dental casting alloys: a review.'
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: Several elements such as nickel and cobalt have relatively high potential to cause allergy, but the true risk of using alloys containing these elements remains undefined.
    explanation: Names nickel and cobalt as the sensitizers.
- name: Beryllium and cadmium content in some alloys
  effect_category: TOXICITY
  description: Known carcinogens in some chemical forms; carcinogenic effects from dental alloys have not been demonstrated but prudence argues for avoiding them.
  evidence:
  - reference: PMID:10668036
    reference_title: 'Biocompatibility of dental casting alloys: a review.'
    supports: SUPPORT
    evidence_source: SYSTEMATIC_REVIEW
    snippet: Several elements in casting alloys are known mutagens, and a few such as beryllium and cadmium are known carcinogens in different chemical forms.
    explanation: Identifies beryllium and cadmium.
regulatory_status:
- agency: FDA
  status: EXEMPT
  regulation_number: '872.3710'
  regulation_title: Base metal alloy
  device_class: CLASS_II
  product_codes:
  - EJH
  pathways:
  - EXEMPT_510K
  special_controls:
  - 'Class II Special Controls Guidance Document: Dental Base Metal Alloys'
  identification: A base metal alloy is a device composed primarily of base metals, such as nickel, chromium, or cobalt, that is intended for use in fabrication of cast or porcelain-fused-to-metal crown and bridge restorations.
  approved_uses:
  - name: Fabrication of cast crown and bridge restorations
    use_context: INDIRECT_RESTORATION
  - name: Fabrication of porcelain-fused-to-metal crown and bridge restorations
    use_context: INDIRECT_RESTORATION
  source_url: https://www.ecfr.gov/current/title-21/section-872.3710
  evidence:
  - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3710
    reference_title: 21 CFR 872.3710 Base metal alloy
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: The device is exempt from the premarket notification procedures in subpart E of part 807 of this chapter subject to the limitations in § 872.9.
    explanation: Class II with special controls, 510(k)-exempt.
  - reference: url:https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpcd/classification.cfm?start_search=1&regulationnumber=872.3710
    reference_title: FDA Product Classification Database, regulation 872.3710
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: EJH Base metal alloy 2 872.3710
    explanation: Product code on 2026-09-04.
