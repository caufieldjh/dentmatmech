# Configuration for linkml-reference-validator.
#
# A reference that cannot be fetched (network hiccup, NCBI rate limit) is a
# WARNING, not an ERROR, so flaky connectivity does not fail CI while a real
# snippet mismatch still does.
unknown_prefix_severity: WARNING

# Bracketed text inside a snippet is normally treated as a curator gloss and
# stripped before comparison. Keep all-caps abbreviations and anything with a
# percent sign as literal source text (same rule as DisMech).
literal_bracket_patterns:
  - "^[A-Z]{2,}$"
  - "%"

# Reference prefixes the validator should not try to fetch. Regulatory
# records cited by url: are validated only for URL presence, not snippet
# match, because the FDA and eCFR pages block automated fetches.
skip_prefixes:
  - url
  - URL
  - ISO
  - CFR
  - FDA_PRODUCT_CODE
